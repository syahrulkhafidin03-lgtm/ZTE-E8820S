          	'.nt-page.offline .nt-rate, .nt-page.offline .nt-usage { opacity: .6; }',
          	'@media (max-width: 860px) { .nt-grid-usage { grid-template-columns: repeat(2, minmax(0, 1fr)); } .nt-grid-usage .nt-usage:last-child { grid-column: 1 / -1; } .nt-sys { grid-template-columns: repeat(3, minmax(0, 1fr)); } .nt-uplinks { grid-template-columns: repeat(2, minmax(0, 1fr)); } .nt-ports { grid-template-columns: repeat(3, minmax(0, 1fr)); } }',
          	'@media (max-width: 640px) { .nt-head { align-items: stretch; flex-direction: column; } .nt-actions { justify-content: flex-start; } .nt-grid-rate { grid-template-columns: 1fr; } .nt-uplinks { grid-template-columns: 1fr; } .nt-ports { grid-template-columns: repeat(2, minmax(0, 1fr)); } .nt-sys { grid-template-columns: repeat(2, minmax(0, 1fr)); } .nt-rate { padding: 16px; } .nt-rate-icon { width: 44px; height: 44px; font-size: 1.4rem; } .nt-ifgrid { grid-template-columns: 1fr; } .nt-footer-info div { white-space: normal; } }'
          ].join('\n');

          function num(v) {
          	v = (typeof v === 'number') ? v : parseFloat(v);
          	return isFinite(v) ? v : 0;
          }

          function fmtData(v) {
          	v = num(v);
          	var units = [ 'B', 'KB', 'MB', 'GB', 'TB' ];
          	var i = 0;

          	while (v >= 1024 && i < units.length - 1) {
          		v /= 1024;
          		i++;
          	}

          	var dec = (i === 0) ? 0 : (v >= 100 ? 0 : (v >= 10 ? 1 : 2));
          	return v.toFixed(dec) + ' ' + units[i];
          }

          function fmtRate(v) {
          	v = num(v) * 8;
          	var units = [ 'bps', 'Kbps', 'Mbps', 'Gbps', 'Tbps' ];
          	var i = 0;

          	while (v >= 1000 && i < units.length - 1) {
          		v /= 1000;
          		i++;
          	}

          	var dec = (v >= 100 ? 0 : (v >= 10 ? 1 : 2));
          	return v.toFixed(dec) + ' ' + units[i];
          }

          function fmtSpeed(mbps) {
          	mbps = num(mbps);

          	if (!mbps)
          		return '—';

          	if (mbps >= 1000)
          		return (mbps / 1000).toFixed(mbps % 1000 ? 1 : 0) + ' Gbps';

          	return mbps + ' Mbps';
          }

          function fmtTime(epoch) {
          	var d = new Date(num(epoch) * 1000);

          	if (!num(epoch) || isNaN(d.getTime()))
          		return '—';

          	function p(n) { return (n < 10 ? '0' : '') + n; }
          	return p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds());
          }

          function fmtUptime(sec) {
          	sec = num(sec);

          	if (!sec)
          		return '—';

          	var d = Math.floor(sec / 86400);
          	var h = Math.floor((sec % 86400) / 3600);
          	var m = Math.floor((sec % 3600) / 60);

          	if (d > 0)
          		return d + 'h ' + h + 'j';
          	if (h > 0)
          		return h + 'j ' + m + 'm';
          	return m + 'm';
          }

          function hexToRgba(hex, alpha) {
          	hex = String(hex || '').replace('#', '');
          	if (hex.length === 3)
          		hex = hex[0] + hex[0] + hex[1] + hex[1] + hex[2] + hex[2];

          	var r = parseInt(hex.slice(0, 2), 16);
          	var g = parseInt(hex.slice(2, 4), 16);
          	var b = parseInt(hex.slice(4, 6), 16);

          	if (!isFinite(r) || !isFinite(g) || !isFinite(b))
          		return 'rgba(34,197,94,' + alpha + ')';

          	return 'rgba(' + r + ',' + g + ',' + b + ',' + alpha + ')';
          }

          function themeById(id) {
          	for (var i = 0; i < THEMES.length; i++) {
          		if (THEMES[i].id === id)
          			return THEMES[i];
          	}
          	return THEMES[0];
          }

          function loadTheme() {
          	try {
          		return window.localStorage.getItem(THEME_KEY) || THEMES[0].id;
          	}
          	catch (e) {
          		return THEMES[0].id;
          	}
          }

          function saveTheme(id) {
          	try {
          		window.localStorage.setItem(THEME_KEY, id);
          	}
          	catch (e) {}
          }

          function el(tag, attrs, children) {
          	var node = E(tag, attrs || {});

          	if (children != null) {
          		if (!Array.isArray(children))
          			children = [ children ];

          		children.forEach(function(child) {
          			if (child == null)
          				return;
          			node.appendChild((typeof child === 'string' || typeof child === 'number')
          				? document.createTextNode(String(child)) : child);
          		});
          	}

          	return node;
          }

          function svg(tag, attrs, children) {
          	var node = document.createElementNS('http://www.w3.org/2000/svg', tag);

          	Object.keys(attrs || {}).forEach(function(k) { node.setAttribute(k, attrs[k]); });

          	(children || []).forEach(function(child) { node.appendChild(child); });
          	return node;
          }

          function makeJack() {
