          chmod 755 package/base-files/files/etc/hotplug.d/iface/95-smartdns-sync

          # 9. Skrip uci-defaults Final (Root Pass, Port WAN->LAN br-lan, WiFi 2.4G & 5G, MWAN3, DNS & Crontab)
          cat <<'OUTER_EOF' > package/base-files/files/etc/uci-defaults/999-custom-settings
          #!/bin/sh

          # --- 1. SET PASSWORD LOGIN LUCI & SSH ROOT (indonesiaraya) ---
          printf "indonesiaraya\nindonesiaraya\n" | passwd root >/dev/null 2>&1 || true

