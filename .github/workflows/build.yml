          uci set firewall.@defaults[0].flow_offloading_hw='0'

          # --- 3. SETUP BR-LAN: LEPASKAN LAN1-LAN4, MASUKKAN PORT FISIK WAN KE BR-LAN ---
          uci set network.lan=interface
          uci set network.lan.device='br-lan'
          uci set network.lan.proto='static'
          uci set network.lan.ipaddr='192.168.11.1'
          uci set network.lan.netmask='255.255.255.0'

          for i in 1 2 3 4; do
              uci del_list network.@device[0].ports="lan$i" 2>/dev/null
          done
          uci del_list network.@device[0].ports='wan' 2>/dev/null
          uci add_list network.@device[0].ports='wan'
          uci -q delete network.@device[0].bridge_empty 2>/dev/null

          # --- 4. NETWORK INTERFACES WAN (LAN1-LAN4 JADI WAN1-WAN4, USB, WWAN, WWAN2) ---
          uci -q delete network.wan 2>/dev/null
          uci -q delete network.wan6 2>/dev/null

          for i in 1 2 3 4; do
              uci set network.wan$i=interface
              uci set network.wan$i.device="lan$i"
              uci set network.wan$i.proto='dhcp'
              uci set network.wan$i.metric="$((i*10))"
              uci set network.wan$i.peerdns='0'
              uci add_list network.wan$i.dns='1.1.1.1'
              uci add_list network.wan$i.dns='8.8.8.8'
          done

          uci set network.wanusb=interface
          uci set network.wanusb.device='usb0'
          uci set network.wanusb.proto='dhcp'
          uci set network.wanusb.metric='80'
          uci set network.wanusb.peerdns='0'

          uci set network.wwan=interface
          uci set network.wwan.proto='dhcp'
          uci set network.wwan.metric='60'
          uci set network.wwan.peerdns='0'

          uci set network.wwan2=interface
          uci set network.wwan2.proto='dhcp'
          uci set network.wwan2.metric='70'
          uci set network.wwan2.peerdns='0'

          uci commit network

          # --- 5. FIREWALL ZONES (MASQUERADE & MTU FIX UNTUK SEMUA WAN) ---
          uci set firewall.@zone[1].masq='1'
          uci set firewall.@zone[1].mtu_fix='1'
          uci -q delete firewall.@zone[1].network 2>/dev/null
          for iface in wan1 wan2 wan3 wan4 wanusb wwan wwan2; do
              uci add_list firewall.@zone[1].network="$iface"
          done
          uci commit firewall

          # --- 6. MWAN3 CONFIGURATION (FAST-FAILOVER + GAMING UDP STICKY) ---
          cat <<'MWAN3_EOF' > /etc/config/mwan3
          config globals 'globals'
          	option mmx_mask '0x3F00'

          config interface 'wan1'
          	option enabled '1'
          	list track_ip '8.8.8.8'
          	list track_ip '1.1.1.1'
          	list track_ip '9.9.9.9'
          	list track_ip '1.0.0.1'
          	option track_method 'ping'
          	option reliability '2'
          	option count '1'
          	option timeout '1'
          	option interval '2'
          	option down '2'
          	option up '3'
          	option check_operstate '1'

          config interface 'wan2'
          	option enabled '1'
          	list track_ip '8.8.8.8'
          	list track_ip '1.1.1.1'
          	list track_ip '9.9.9.9'
          	list track_ip '1.0.0.1'
          	option track_method 'ping'
          	option reliability '2'
          	option count '1'
          	option timeout '1'
          	option interval '2'
          	option down '2'
          	option up '3'
          	option check_operstate '1'

          config interface 'wan3'
          	option enabled '1'
          	list track_ip '8.8.8.8'
          	list track_ip '1.1.1.1'
          	list track_ip '9.9.9.9'
          	list track_ip '1.0.0.1'
          	option track_method 'ping'
          	option reliability '2'
          	option count '1'
          	option timeout '1'
          	option interval '2'
          	option down '2'
          	option up '3'
          	option check_operstate '1'

          config interface 'wan4'
          	option enabled '1'
          	list track_ip '8.8.8.8'
          	list track_ip '1.1.1.1'
          	list track_ip '9.9.9.9'
          	list track_ip '1.0.0.1'
          	option track_method 'ping'
          	option reliability '2'
          	option count '1'
          	option timeout '1'
          	option interval '2'
          	option down '2'
          	option up '3'
          	option check_operstate '1'

          config interface 'wwan'
          	option enabled '1'
          	list track_ip '8.8.8.8'
          	list track_ip '1.1.1.1'
          	list track_ip '9.9.9.9'
          	list track_ip '1.0.0.1'
          	option track_method 'ping'
          	option reliability '2'
          	option count '1'
          	option timeout '1'
          	option interval '2'
          	option down '2'
          	option up '3'
          	option check_operstate '1'

          config interface 'wwan2'
          	option enabled '1'
          	list track_ip '8.8.8.8'
          	list track_ip '1.1.1.1'
          	list track_ip '9.9.9.9'
          	list track_ip '1.0.0.1'
          	option track_method 'ping'
          	option reliability '2'
          	option count '1'
          	option timeout '1'
          	option interval '2'
          	option down '2'
          	option up '3'
          	option check_operstate '1'

          config interface 'wanusb'
          	option enabled '1'
          	list track_ip '8.8.8.8'
          	list track_ip '1.1.1.1'
          	list track_ip '9.9.9.9'
          	list track_ip '1.0.0.1'
          	option track_method 'ping'
          	option reliability '2'
          	option count '1'
          	option timeout '1'
          	option interval '2'
          	option down '2'
          	option up '3'
          	option check_operstate '1'

          config member 'wan1_m1_w1'
          	option interface 'wan1'
          	option metric '1'
          	option weight '1'

          config member 'wan2_m1_w1'
          	option interface 'wan2'
          	option metric '1'
          	option weight '1'

          config member 'wan3_m1_w1'
          	option interface 'wan3'
          	option metric '1'
          	option weight '1'

          config member 'wan4_m1_w1'
          	option interface 'wan4'
          	option metric '1'
          	option weight '1'

          config member 'wwan_m1_w1'
          	option interface 'wwan'
          	option metric '1'
          	option weight '1'

          config member 'wwan2_m1_w1'
          	option interface 'wwan2'
          	option metric '1'
          	option weight '1'

          config member 'wanusb_m1_w1'
          	option interface 'wanusb'
          	option metric '1'
          	option weight '1'

          config policy 'balanced'
          	list use_member 'wan1_m1_w1'
          	list use_member 'wan2_m1_w1'
          	list use_member 'wan3_m1_w1'
          	list use_member 'wan4_m1_w1'
          	list use_member 'wwan_m1_w1'
          	list use_member 'wwan2_m1_w1'
          	list use_member 'wanusb_m1_w1'
          	option last_resort 'unreachable'

          config rule 'https_sticky'
          	option dest_port '443'
          	option proto 'tcp'
          	option sticky '1'
          	option timeout '600'
          	option use_policy 'balanced'

          config rule 'gaming_udp_sticky'
          	option dest_port '5000:5600,7000:9000,10000:20000,27000:27100,30000:30100'
          	option proto 'udp'
          	option sticky '1'
          	option timeout '1200'
          	option use_policy 'balanced'

          config rule 'default_rule_v4'
          	option dest_ip '0.0.0.0/0'
          	option use_policy 'balanced'
          MWAN3_EOF
          uci commit mwan3

          # --- 7. GENERATE & KONFIGURASI WIFI 2.4G (Openwrt) & 5G (Openwrt-5GHZ) ---
          [ -f /etc/config/wireless ] || /sbin/wifi config >/dev/null 2>&1 || true

          for r in 0 1; do
              uci -q get wireless.radio${r} >/dev/null || continue
              BAND=$(uci -q get wireless.radio${r}.band)
              [ -z "$BAND" ] && [ "$r" = "1" ] && BAND="5g"

              uci set wireless.radio${r}.disabled='0'
              uci set wireless.radio${r}.country='ID'
              uci set wireless.radio${r}.channel='auto'
              uci set wireless.radio${r}.legacy_rates='0'
              uci set wireless.radio${r}.beacon_int='100'

              uci set wireless.default_radio${r}=wifi-iface
              uci set wireless.default_radio${r}.device="radio${r}"
              uci set wireless.default_radio${r}.network='lan'
              uci set wireless.default_radio${r}.mode='ap'
              uci set wireless.default_radio${r}.encryption='psk2'
              uci set wireless.default_radio${r}.cipher='ccmp'
              uci set wireless.default_radio${r}.disabled='0'
              uci set wireless.default_radio${r}.wmm='1'
              uci set wireless.default_radio${r}.uapsd='1'
              uci set wireless.default_radio${r}.dtim_period='2'
              uci set wireless.default_radio${r}.short_gi_20='1'
              uci set wireless.default_radio${r}.short_gi_40='1'
              uci set wireless.default_radio${r}.disassoc_low_ack='1'
              uci set wireless.default_radio${r}.max_inactivity='120'
              uci set wireless.default_radio${r}.ieee80211k='1'
              uci set wireless.default_radio${r}.bss_transition='1'

              if [ "$BAND" = "5g" ]; then
                  uci set wireless.radio${r}.htmode='VHT80'
                  uci set wireless.radio${r}.txpower='20'
                  uci -q delete wireless.radio${r}.channels 2>/dev/null
                  for ch in 36 40 44 48 149 153 157 161; do
                      uci add_list wireless.radio${r}.channels="$ch"
                  done
                  uci set wireless.radio${r}.short_gi_80='1'
                  uci set wireless.default_radio${r}.ssid='Openwrt-5GHZ'
                  uci set wireless.default_radio${r}.key='internetcepat'
              else
                  uci set wireless.radio${r}.htmode='HT20'
                  uci set wireless.radio${r}.txpower='18'
                  uci -q delete wireless.radio${r}.channels 2>/dev/null
                  for ch in 1 6 11; do
                      uci add_list wireless.radio${r}.channels="$ch"
                  done
                  uci set wireless.default_radio${r}.ssid='Openwrt'
                  uci set wireless.default_radio${r}.key='internet'
              fi
          done
          uci commit wireless

          # --- 8. HUBUNGKAN DNSMASQ KE SMARTDNS (127.0.0.1#6053) ---
          uci set dhcp.@dnsmasq[0].noresolv='1'
          uci set dhcp.@dnsmasq[0].cachesize='0'
          uci set dhcp.@dnsmasq[0].dns_forward_max='300'
          uci -q delete dhcp.@dnsmasq[0].server || true
          uci add_list dhcp.@dnsmasq[0].server='127.0.0.1#6053'
          uci commit dhcp

          # --- 9. AUTO DEEP MAINTENANCE & FREERAM CRONTAB (SETIAP JAM 03:00) ---
          mkdir -p /etc/crontabs
          touch /etc/crontabs/root
          sed -i '/freeram.sh/d' /etc/crontabs/root
          echo "0 3 * * * /usr/bin/freeram.sh" >> /etc/crontabs/root
          /etc/init.d/cron enable 2>/dev/null || true

          exit 0
          OUTER_EOF
          chmod 755 package/base-files/files/etc/uci-defaults/999-custom-settings

      - name: Gunakan config.buildinfo Resmi OpenWrt 25.12.6 + Driver WiFi & Paket Lengkap
        working-directory: openwrt
        run: |
          wget -O .config https://downloads.openwrt.org/releases/25.12.6/targets/ramips/mt7621/config.buildinfo

          # Kunci build khusus ZTE E8820S
          sed -i '/CONFIG_TARGET_DEVICE_/d' .config
          sed -i '/CONFIG_TARGET_MULTI_PROFILE/d' .config
          sed -i '/CONFIG_TARGET_ALL_PROFILES/d' .config
          sed -i '/CONFIG_TARGET_PER_DEVICE_ROOTFS/d' .config
          sed -i '/CONFIG_IB/d' .config
          sed -i '/CONFIG_SDK/d' .config

          # Bersihkan status =m pada driver WiFi agar dipaksa masuk built-in (=y)
          sed -i '/CONFIG_PACKAGE_kmod-mt7603/d' .config
          sed -i '/CONFIG_PACKAGE_kmod-mt76x2/d' .config
          sed -i '/CONFIG_PACKAGE_wpad-/d' .config

          cat <<'EOF' >> .config
          CONFIG_TARGET_ramips=y
          CONFIG_TARGET_ramips_mt7621=y
          CONFIG_TARGET_ramips_mt7621_DEVICE_zte_e8820s=y
          # CONFIG_TARGET_MULTI_PROFILE is not set
          # CONFIG_TARGET_ALL_PROFILES is not set
          # CONFIG_TARGET_PER_DEVICE_ROOTFS is not set
          # CONFIG_IB is not set
          # CONFIG_SDK is not set
          CONFIG_CCACHE=y

          # --- Driver WiFi 2.4GHz (MT7603) & 5GHz (MT7612) + WPA2/802.11k/v ---
          CONFIG_PACKAGE_kmod-mt7603=y
          CONFIG_PACKAGE_kmod-mt76x2=y
          CONFIG_PACKAGE_wpad-mbedtls=y
          # CONFIG_PACKAGE_wpad-basic-mbedtls is not set
          CONFIG_PACKAGE_iw=y
          CONFIG_PACKAGE_iwinfo=y
          CONFIG_PACKAGE_wireless-regdb=y

          # --- LuCI, Tema & Utilitas ---
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-ssl=y
          CONFIG_PACKAGE_luci-theme-material=y
          CONFIG_PACKAGE_luci-app-filemanager=y
          CONFIG_PACKAGE_luci-app-ttyd=y

          # --- Multi-Core, TCP BBR & Conntrack Cleaner ---
          CONFIG_PACKAGE_irqbalance=y
          CONFIG_PACKAGE_kmod-tcp-bbr=y
          CONFIG_PACKAGE_conntrack=y

          # --- SmartDNS Dual-Engine IX Peering & TLS CA Bundle ---
          CONFIG_PACKAGE_smartdns=y
          CONFIG_PACKAGE_luci-app-smartdns=y
          CONFIG_PACKAGE_ca-bundle=y
          CONFIG_PACKAGE_ca-certificates=y

          # --- MWAN3 Load Balancing ---
          CONFIG_PACKAGE_mwan3=y
          CONFIG_PACKAGE_luci-app-mwan3=y

          # --- USB 3.0, USB Tethering, & Modem 3G/4G/5G ---
          CONFIG_PACKAGE_kmod-usb3=y
          CONFIG_PACKAGE_usbutils=y
          CONFIG_PACKAGE_usb-modeswitch=y
          CONFIG_PACKAGE_luci-proto-3g=y
          CONFIG_PACKAGE_luci-proto-modemmanager=y
          CONFIG_PACKAGE_modemmanager=y
          CONFIG_PACKAGE_kmod-usb-net-rtl8152=y
          CONFIG_PACKAGE_kmod-usb-net-asix=y
          CONFIG_PACKAGE_kmod-usb-net-rndis=y
          CONFIG_PACKAGE_kmod-usb-net-cdc-ether=y
          CONFIG_PACKAGE_kmod-usb-net-cdc-ncm=y
          CONFIG_PACKAGE_kmod-usb-net-cdc-mbim=y
          CONFIG_PACKAGE_kmod-usb-net-huawei-cdc-ncm=y
          CONFIG_PACKAGE_kmod-usb-serial=y
          CONFIG_PACKAGE_kmod-usb-serial-wwan=y
          CONFIG_PACKAGE_kmod-usb-serial-option=y
          EOF

          make defconfig

      - name: Download Source Paket
        working-directory: openwrt
        run: |
          make download -j$(nproc)
          find dl -size -1024c -exec ls -l {} \;
          find dl -size -1024c -exec rm -f {} \;

      - name: Compile Firmware OpenWrt 25.12.6
        working-directory: openwrt
        run: |
          make -j$(nproc) || make -j1 V=s

      - name: Siapkan File Output
        run: |
          mkdir -p output
          cp -f openwrt/bin/targets/ramips/mt7621/*zte_e8820s* output/
          cp -f openwrt/.config output/config.buildinfo
          ls -lh output/

      - name: Upload ke GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: openwrt-25.12.6-e8820s-${{ github.run_number }}
          name: OpenWrt 25.12.6 ZTE E8820S Final Max Performance + SmartDNS IX + NetTraffic (Build #${{ github.run_number }})
          body: |
            Custom build **OpenWrt v25.12.6** untuk **ZTE E8820S (BREED Layout HC5962)**:
            - **Login LuCI & SSH:** `192.168.11.1` | User: `root` | Pass: `indonesiaraya`
            - **WiFi 2.4GHz:** SSID `Openwrt` | Pass: `internet`
            - **WiFi 5GHz (VHT80 Non-DFS):** SSID `Openwrt-5GHZ` | Pass: `internetcepat`
            - **Port Mapping:** Port fisik `WAN` -> **LAN (`br-lan`)** | Port `LAN1`–`LAN4` -> **WAN1–WAN4 (MWAN3)** + `wanusb`, `wwan`, `wwan2`
            - **Performa & Latency:** TCP BBR + `fq_codel`, 4-Thread SMP RPS/XPS, Wi-Fi AQL Low-Latency + Auto DSCP QoS Gaming (`EF`), SmartDNS IX/SG Peering (`fastest-ip`), Auto Deep-Clean `03:00` (`/usr/bin/freeram.sh`).
