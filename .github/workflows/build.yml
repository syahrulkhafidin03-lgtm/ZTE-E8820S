          	refresh: function() {
          		var self = this;

          		return callStatus().then(function(status) {
          			if (!status || status.ok === false) {
          				self.showOffline(status && status.error);
          				return;
          			}

          			self.update(status);
          			self.showWarning(status);
          		}).catch(function(err) {
          			self.showOffline(err && err.message ? err.message : String(err));
          		});
          	},

          	update: function(status) {
          		var self = this;
          		var s = status || {};
          		var ports = Array.isArray(s.ports) ? s.ports : [];
          		var dayRx = num(s.day_rx), dayTx = num(s.day_tx);
          		var monthRx = num(s.month_rx), monthTx = num(s.month_tx);
          		var allRx = num(s.rx_total), allTx = num(s.tx_total);

          		this.nodes.rxRate.textContent = fmtRate(s.rx_rate);
          		this.nodes.txRate.textContent = fmtRate(s.tx_rate);
          		this.nodes.rxTotal.textContent = fmtData(allRx);
          		this.nodes.txTotal.textContent = fmtData(allTx);

          		this.nodes.dayTotal.textContent = fmtData(dayRx + dayTx);
          		this.nodes.dayRx.textContent = fmtData(dayRx);
          		this.nodes.dayTx.textContent = fmtData(dayTx);

          		this.nodes.monthTotal.textContent = fmtData(monthRx + monthTx);
          		this.nodes.monthRx.textContent = fmtData(monthRx);
          		this.nodes.monthTx.textContent = fmtData(monthTx);

          		this.nodes.allTotal.textContent = fmtData(allRx + allTx);
          		this.nodes.allRx.textContent = fmtData(allRx);
          		this.nodes.allTx.textContent = fmtData(allTx);

          		var upCount = ports.filter(function(p) { return p && p.up === true; }).length;
          		this.nodes.portNote.textContent = ports.length
          			? upCount + '/' + ports.length + ' port terhubung'
          			: 'Port tidak terdeteksi';

          		var sig = JSON.stringify(ports);
          		if (sig !== this.lastPorts) {
          			this.lastPorts = sig;
          			while (this.nodes.ports.firstChild)
          				this.nodes.ports.removeChild(this.nodes.ports.firstChild);
          			if (ports.length) {
          				ports.forEach(function(p) { self.nodes.ports.appendChild(portCard(p)); }, this);
          			}
          			else {
          				this.nodes.ports.appendChild(el('div', { 'class': 'nt-section-note' }, 'Tidak ada port yang bisa dibaca.'));
          			}
          		}

          		var uplinks = Array.isArray(s.uplinks) ? s.uplinks : [];
          		if (!uplinks.length && Array.isArray(s.interfaces)) {
          			uplinks = s.interfaces.map(function(dev) {
          				return { device: dev, up: true };
          			});
          		}

          		var upSig = JSON.stringify(uplinks);
          		if (upSig !== this.lastUplinks) {
          			this.lastUplinks = upSig;
          			while (this.nodes.uplinks.firstChild)
          				this.nodes.uplinks.removeChild(this.nodes.uplinks.firstChild);
          			if (uplinks.length) {
          				uplinks.forEach(function(u) { self.nodes.uplinks.appendChild(uplinkCard(u)); });
          			}
          			else {
          				this.nodes.uplinks.appendChild(el('div', { 'class': 'nt-section-note' }, 'Uplink internet tidak terdeteksi.'));
          			}
          		}

          		var activeNames = uplinks.filter(function(u) {
          			return u && u.active === true;
          		}).map(function(u) {
          			return u.device;
          		});

          		this.nodes.uplinkNote.textContent = uplinks.length
          			? uplinks.length + ' uplink • aktif: ' + (activeNames.join(', ') || '—')
          			: '—';

          		this.updateIfaces(s);

          		this.nodes.updated.textContent = num(s.time) ? 'Diperbarui ' + fmtTime(s.time) : '—';
          		this.nodes.wanInfo.textContent = (Array.isArray(s.interfaces) && s.interfaces.length)
          			? 'Uplink: ' + s.interfaces.join(', ')
          			: 'Uplink: tidak terdeteksi';
          		this.nodes.saveInfo.textContent = num(s.saved_at)
          			? 'Tersimpan ' + fmtTime(s.saved_at) + ' • otomatis tiap ' + num(s.save_interval || 60) + ' detik.'
          			: 'Data dan grafik disimpan otomatis tiap ' + num(s.save_interval || 60) + ' detik.';

          		this.nodes.live.classList.remove('offline');
          		this.nodes.liveText.textContent = 'Monitor aktif';
          		this.root.classList.remove('offline');

          		this.history = Array.isArray(s.history) ? s.history : [];
          		this.drawGraph(this.history);

          		var sys = s.system || {};
          		var load = Array.isArray(sys.load) ? sys.load : [ 0, 0, 0 ];
          		var memTotal = num(sys.mem_total_kb);
          		var memUsed = num(sys.mem_used_kb);
          		var flashTotal = num(sys.flash_total_kb);
          		var flashUsed = num(sys.flash_used_kb);
          		var temp = sys.temp_c;
          		var wifiAvailable = sys.wifi_available === true;

          		while (this.nodes.sys.firstChild)
          			this.nodes.sys.removeChild(this.nodes.sys.firstChild);

          		[
          			sysTile('CPU load', num(load[0]).toFixed(2), '1 menit'),
          			sysTile('RAM', memTotal ? num(sys.mem_percent) + '%' : '—',
          				memTotal ? fmtData(memUsed * 1024) + ' / ' + fmtData(memTotal * 1024) : '—'),
          			sysTile('Suhu', (temp == null) ? '—' : num(temp).toFixed(1) + ' °C', 'CPU'),
          			sysTile('Flash', flashTotal ? num(sys.flash_percent) + '%' : '—',
          				flashTotal ? fmtData(flashUsed * 1024) + ' / ' + fmtData(flashTotal * 1024) : '—'),
          			sysTile('Client WiFi', wifiAvailable ? String(num(sys.wifi_clients)) : '—',
          				wifiAvailable ? 'terhubung' : 'tidak tersedia'),
          			sysTile('Uptime', fmtUptime(s.uptime), 'sejak boot')
          		].forEach(function(tile) {
          			self.nodes.sys.appendChild(tile);
          		});
          	},

          	updateIfaces: function(status) {
          		var self = this;
          		var ifaces = Array.isArray(status.ifaces) ? status.ifaces.slice() : null;

          		if (!ifaces) {
          			ifaces = [];
          		}

          		ifaces = ifaces.filter(function(item) { return item && item.device; });

          		var usbFound = status.usb_found === true || ifaces.some(function(i) {
          			return i.kind === 'usb' || /^(usb|wwan|rndis)/.test(String(i.device || ''));
          		});

          		if (!usbFound) {
          			ifaces.push({
          				device: '__usb', label: 'USB', kind: 'usb', placeholder: true,
          				up: false, rx_rate: 0, tx_rate: 0, rx_total: 0, tx_total: 0, history: []
          			});
          		}

          		ifaces.sort(function(a, b) { return ifaceRank(a) - ifaceRank(b); });

          		var keep = {};

          		ifaces.forEach(function(item) {
          			var key = item.device;
          			keep[key] = true;

          			var card = self.ifCards[key];
          			if (!card) {
          				card = createIfaceCard();
          				self.ifCards[key] = card;
          				self.nodes.ifaces.appendChild(card.root);
          			}

          			card.history = item.placeholder ? [] : (Array.isArray(item.history) ? item.history : []);
          			card.placeholder = item.placeholder === true;
          			self.updateIfaceCard(card, item);
          		});

          		Object.keys(this.ifCards).forEach(function(key) {
          			if (keep[key])
          				return;
          			var card = self.ifCards[key];
          			if (card.root.parentNode)
          				card.root.parentNode.removeChild(card.root);
          			delete self.ifCards[key];
          		});

          		ifaces.forEach(function(item) {
          			var card = self.ifCards[item.device];
          			if (card && self.nodes.ifaces.lastChild !== card.root)
          				self.nodes.ifaces.appendChild(card.root);
          		});

          		var real = ifaces.filter(function(i) { return !i.placeholder; });
          		var up = real.filter(function(i) { return i.up === true; }).length;

          		this.nodes.ifNote.textContent = real.length
          			? up + '/' + real.length + ' interface terhubung'
          			: '—';
          	},

          	updateIfaceCard: function(card, item) {
          		var up = item.up === true;
          		var placeholder = item.placeholder === true;
          		var kind = String(item.kind || 'lan').toUpperCase();

          		card.root.classList.toggle('down', !up && !placeholder);
          		card.root.classList.toggle('placeholder', placeholder);

          		card.name.textContent = item.label || item.device || '—';
          		card.dev.textContent = placeholder ? '' : (item.device || '');

          		if (item.wan === true && kind !== 'WAN')
          			kind += ' • WAN';
          		card.kind.textContent = kind;
          		card.kind.classList.toggle('wan', item.wan === true);

          		card.rx.textContent = placeholder ? '—' : fmtRate(item.rx_rate);
          		card.tx.textContent = placeholder ? '—' : fmtRate(item.tx_rate);
          		card.rxTotal.textContent = placeholder ? '—' : fmtData(item.rx_total);
          		card.txTotal.textContent = placeholder ? '—' : fmtData(item.tx_total);

          		if (placeholder) {
          			card.meta.textContent = 'Port USB tidak terdeteksi';
          			card.empty.textContent = 'Belum ada perangkat USB';
          			card.empty.hidden = false;
          		}
          		else {
          			var parts = [];

          			if (num(item.speed))
          				parts.push(fmtSpeed(item.speed));
          			if (item.duplex)
          				parts.push(item.duplex);
          			parts.push(up ? 'Terhubung' : 'Tidak terhubung');

          			card.meta.textContent = parts.join(' • ');
          			card.empty.textContent = 'Menunggu data…';
          			card.empty.hidden = card.history.length >= 2;
          		}

          		this.drawSeries(card.chart, card.history, { height: 82, compact: true });
          	},

          	setTheme: function(id, redraw) {
          		var theme = themeById(id);

          		this.theme = theme;

          		if (this.root) {
          			this.root.style.setProperty('--nt-rx', theme.rx);
          			this.root.style.setProperty('--nt-tx', theme.tx);
          			this.root.style.setProperty('--nt-accent', theme.accent);
          			this.root.style.setProperty('--nt-accent-soft', hexToRgba(theme.accent, .15));
          		}

          		if (this.nodes.themeText)
          			this.nodes.themeText.textContent = theme.name;
          		if (this.nodes.theme)
          			this.nodes.theme.setAttribute('title', 'Tema: ' + theme.name + ' (klik untuk ganti)');

          		if (redraw)
          			this.redrawAll();
          	},

          	onTheme: function() {
          		if (!this.theme)
          			this.theme = THEMES[0];

          		var idx = THEMES.indexOf(this.theme);
          		if (idx < 0)
          			idx = 0;

          		var next = THEMES[(idx + 1) % THEMES.length];

          		this.setTheme(next.id, true);
          		saveTheme(next.id);
          	},

          	redrawAll: function() {
          		var self = this;

          		this.drawGraph(this.history);

          		Object.keys(this.ifCards).forEach(function(key) {
          			var card = self.ifCards[key];
          			self.drawSeries(card.chart, card.history, { height: 82, compact: true });
          		});
          	},

          	showWarning: function(status) {
          		var msg = '';

          		if (status && status.wan_detected === false)
          			msg = 'Interface WAN belum terdeteksi. Hubungkan sumber internet ke LAN 1–4 atau USB/Modem.';

          		this.nodes.warning.hidden = !msg;
          		this.nodes.warningText.textContent = msg;
          	},

          	showOffline: function(error) {
          		this.nodes.live.classList.add('offline');
          		this.nodes.liveText.textContent = 'Monitor tidak aktif';
          		this.root.classList.add('offline');
          		this.nodes.warning.hidden = false;
          		this.nodes.warningText.textContent = error
          			? 'Monitor tidak aktif: ' + error
          			: 'Monitor tidak aktif. Jalankan /etc/init.d/nettraffic start.';
          	},

          	drawGraph: function(history) {
          		var canvas = this.nodes.chart;
          		if (!canvas)
          			return;

          		history = Array.isArray(history) ? history : [];
          		this.drawSeries(canvas, history, { height: 140 });

          		if (this.nodes.chartEmpty)
          			this.nodes.chartEmpty.hidden = history.length >= 2;
          	},

          	drawSeries: function(canvas, history, opts) {
          		if (!canvas)
          			return;

          		opts = opts || {};
          		history = Array.isArray(history) ? history : [];

          		var theme = this.theme || THEMES[0];
          		var cssW = canvas.clientWidth || (canvas.parentNode && canvas.parentNode.clientWidth) || opts.width || 240;
          		var cssH = canvas.clientHeight || opts.height || 140;

          		if (cssW < 2)
          			cssW = opts.width || 240;
          		if (cssH < 2)
          			cssH = opts.height || 140;

          		var dpr = window.devicePixelRatio || 1;

          		canvas.width = Math.max(1, Math.round(cssW * dpr));
          		canvas.height = Math.max(1, Math.round(cssH * dpr));

          		var ctx = canvas.getContext('2d');
          		if (!ctx)
          			return;

          		ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
          		ctx.clearRect(0, 0, cssW, cssH);

          		var padX = 8;
          		var padTop = opts.compact ? 6 : 8;
          		var padBottom = opts.compact ? 4 : 6;
          		var w = Math.max(1, cssW - padX * 2);
          		var h = Math.max(1, cssH - padTop - padBottom);

          		if (history.length < 2) {
          			ctx.strokeStyle = 'rgba(128,128,128,.28)';
          			ctx.lineWidth = 1;
          			ctx.beginPath();
          			ctx.moveTo(padX, cssH - padBottom);
          			ctx.lineTo(cssW - padX, cssH - padBottom);
          			ctx.stroke();
          			return;
          		}

          		var max = 1;
          		history.forEach(function(pair) {
          			max = Math.max(max, num(pair && pair[0]), num(pair && pair[1]));
          		});

          		ctx.strokeStyle = 'rgba(128,128,128,.16)';
          		ctx.lineWidth = 1;
          		for (var g = 0; g <= 4; g++) {
          			var gy = padTop + (h * g / 4);
          			ctx.beginPath();
          			ctx.moveTo(padX, gy);
          			ctx.lineTo(cssW - padX, gy);
          			ctx.stroke();
          		}

          		function point(i, value) {
          			var x = padX + (history.length === 1 ? 0 : (w * i / (history.length - 1)));
          			var y = padTop + (h * (1 - value / max));
          			return [ x, y ];
          		}

          		var grad = ctx.createLinearGradient(0, padTop, 0, padTop + h);
          		grad.addColorStop(0, hexToRgba(theme.rx, .26));
          		grad.addColorStop(1, hexToRgba(theme.rx, 0));
          		ctx.beginPath();
          		ctx.moveTo(padX, padTop + h);
          		history.forEach(function(pair, i) {
          			var pt = point(i, num(pair && pair[0]));
          			ctx.lineTo(pt[0], pt[1]);
          		});
          		ctx.lineTo(padX + w, padTop + h);
          		ctx.closePath();
          		ctx.fillStyle = grad;
          		ctx.fill();

          		function line(index, color) {
          			ctx.beginPath();
          			history.forEach(function(pair, i) {
          				var pt = point(i, num(pair && pair[index]));
          				if (i === 0) ctx.moveTo(pt[0], pt[1]);
          				else ctx.lineTo(pt[0], pt[1]);
          			});
          			ctx.strokeStyle = color;
          			ctx.lineWidth = opts.compact ? 1.6 : 2;
          			ctx.lineJoin = 'round';
          			ctx.lineCap = 'round';
          			ctx.stroke();
          		}

          		line(0, theme.rx);
          		line(1, theme.tx);

          		[ 0, 1 ].forEach(function(index) {
          			var pt = point(history.length - 1, num(history[history.length - 1] && history[history.length - 1][index]));
          			ctx.beginPath();
          			ctx.arc(pt[0], pt[1], opts.compact ? 2 : 2.5, 0, Math.PI * 2);
          			ctx.fillStyle = index === 0 ? theme.rx : theme.tx;
          			ctx.fill();
          		});

          		if (!opts.compact) {
          			ctx.fillStyle = 'rgba(128,128,128,.9)';
          			ctx.font = '11px sans-serif';
          			ctx.textAlign = 'right';
          			ctx.fillText(fmtRate(max), cssW - padX, 12);
          		}
          	},

          	onReset: function() {
          		var self = this;

          		if (!window.confirm('Reset data pemakaian dan semua grafik interface? Tindakan ini tidak bisa dibatalkan.'))
          			return;

          		this.nodes.reset.disabled = true;

          		return callReset().then(function(res) {
          			if (!res || res.ok === false) {
          				ui.addNotification(null, el('p', {}, (res && res.error) || 'Gagal mereset data.'), 'danger');
          				return;
          			}

          			ui.addNotification(null, el('p', {}, 'Data pemakaian dan grafik berhasil direset.'), 'info');

          			return new Promise(function(resolve) {
          				window.setTimeout(resolve, 1200);
          			}).then(function() {
          				return self.refresh();
          			});
          		}).catch(function(err) {
          			ui.addNotification(null, el('p', {}, 'Gagal mereset: ' + (err && err.message ? err.message : err)), 'danger');
          		}).then(function() {
          			self.nodes.reset.disabled = false;
          		});
          	},

          	remove: function() {
          		if (this._onResize)
          			window.removeEventListener('resize', this._onResize);
          		if (this._mountTimer)
          			window.clearTimeout(this._mountTimer);
          	},

          	handleSaveApply: null,
          	handleSave: null,
          	handleReset: null
          });
