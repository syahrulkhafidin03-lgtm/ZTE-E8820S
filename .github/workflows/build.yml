name: Build ImmortalWrt ZTE E8820S (BREED)

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Pilih Branch ImmortalWrt'
        required: true
        default: 'openwrt-25.12'
        type: choice
        options:
          - openwrt-25.12
          - openwrt-24.10
          - master

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repo ZTE-E8820S
        uses: actions/checkout@v4

      - name: Bersihkan Ruang Disk Runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true
          df -h

      - name: Install Dependensi Kompilasi
        run: |
          sudo apt-get update
          sudo apt-get install -y ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache clang cmake cpio curl device-tree-compiler ecj fastjar flex gawk gettext gcc-multilib \
            g++-multilib git gnutls-dev gperf haveged help2man intltool lib32gcc-s1 libc6-dev-i386 libelf-dev \
            libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses-dev libpython3-dev \
            libreadline-dev libssl-dev libtool libyaml-dev libz-dev lld llvm lrzsz mkisofs msmtp nano \
            ninja-build p7zip p7zip-full patch pkgconf python3 python3-pip python3-ply python3-docutils \
            python3-pyelftools qemu-utils re2c rsync scons squashfs-tools subversion swig texinfo uglifyjs \
            upx-ucl unzip vim wget xmlto xxd zlib1g-dev zstd

      - name: Clone Source ImmortalWrt
        run: |
          git clone --depth=1 -b ${{ github.event.inputs.branch || 'openwrt-25.12' }} https://github.com/immortalwrt/immortalwrt.git immortalwrt

      - name: Update & Install Feeds
        working-directory: immortalwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Terapkan Patch BREED & Custom Files dari Repo
        working-directory: immortalwrt
        run: |
          # 1. Timpa DTS dengan versi BREED dari folder patch/ Anda
          cp -f ../patch/mt7621_zte_e8820s.dts target/linux/ramips/dts/mt7621_zte_e8820s.dts

          # 2. Hapus definisi zte_e8820s bawaan ImmortalWrt (U-Boot mod), lalu masukkan patch/zte.txt
          python3 - <<'PY'
          import re
          mk_path = "target/linux/ramips/image/mt7621.mk"
          with open(mk_path, "r", encoding="utf-8") as f:
              content = f.read()
          content = re.sub(r"\ndefine Device/zte_e8820s\b.*?TARGET_DEVICES \+= zte_e8820s\s*", "\n", content, flags=re.DOTALL)
          with open("../patch/zte.txt", "r", encoding="utf-8") as f:
              zte_patch = f.read()
          with open(mk_path, "w", encoding="utf-8") as f:
              f.write(content.rstrip() + "\n\n" + zte_patch.strip() + "\n")
          PY

          # 3. Terapkan patch LED & Sysupgrade secara aman (hindari duplikat)
          LEDS_FILE="target/linux/ramips/mt7621/base-files/etc/board.d/01_leds"
          UPGRADE_FILE="target/linux/ramips/mt7621/base-files/lib/upgrade/platform.sh"

          if ! grep -q "zte,e8820s" "$LEDS_FILE" && [ -f ../patch/leds.txt ]; then
            sed -i '/esac/e cat ../patch/leds.txt' "$LEDS_FILE"
          fi

          if ! grep -q "zte,e8820s" "$UPGRADE_FILE" && [ -f ../patch/upgrade.txt ]; then
            sed -i '/case "$board" in/r ../patch/upgrade.txt' "$UPGRADE_FILE"
          fi

          # 4. Masukkan 99-default-settings & folder custom files/ (mwan3, dll)
          if [ -f ../patch/99-default-settings ]; then
            mkdir -p package/base-files/files/etc/uci-defaults
            cp -f ../patch/99-default-settings package/base-files/files/etc/uci-defaults/99-default-settings
          fi

          if [ -d ../files ]; then
            cp -rf ../files ./files
          fi

      - name: Konfigurasi Target & Paket (.config)
        working-directory: immortalwrt
        run: |
          cat <<'EOF' > .config
          CONFIG_TARGET_ramips=y
          CONFIG_TARGET_ramips_mt7621=y
          CONFIG_TARGET_ramips_mt7621_DEVICE_zte_e8820s=y

          # --- Interface LuCI & Bahasa/Tema ---
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-ssl=y

          # --- Multi-WAN & Load Balancing (sesuai folder files/etc/config Anda) ---
          CONFIG_PACKAGE_mwan3=y
          CONFIG_PACKAGE_luci-app-mwan3=y

          # --- SQM QoS Anti-Lag & DNS-over-HTTPS ---
          CONFIG_PACKAGE_sqm-scripts=y
          CONFIG_PACKAGE_luci-app-sqm=y
          CONFIG_PACKAGE_https-dns-proxy=y
          CONFIG_PACKAGE_luci-app-https-dns-proxy=y

          # --- Dukungan USB 3.0 & Storage ---
          CONFIG_PACKAGE_kmod-usb3=y
          CONFIG_PACKAGE_kmod-usb-storage=y
          CONFIG_PACKAGE_kmod-fs-ext4=y
          CONFIG_PACKAGE_block-mount=y

          # --- Utilitas Script & Terminal ---
          CONFIG_PACKAGE_curl=y
          CONFIG_PACKAGE_ca-bundle=y
          CONFIG_PACKAGE_bash=y
          CONFIG_PACKAGE_htop=y
          EOF

          make defconfig

      - name: Download Source Paket
        working-directory: immortalwrt
        run: |
          make download -j$(nproc)
          find dl -size -1024c -exec ls -l {} \;
          find dl -size -1024c -exec rm -f {} \;

      - name: Compile Firmware ImmortalWrt
        working-directory: immortalwrt
        run: |
          make -j$(nproc) || make -j1 V=s

      - name: Siapkan File Output
        run: |
          mkdir -p output
          cp -f immortalwrt/bin/targets/ramips/mt7621/*zte_e8820s* output/
          cp -f immortalwrt/.config output/config.buildinfo
          ls -lh output/

      - name: Upload ke GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: immortalwrt-e8820s-${{ github.run_number }}
          name: ImmortalWrt ${{ github.event.inputs.branch || 'openwrt-25.12' }} ZTE E8820S (Build #${{ github.run_number }})
          body: |
            Custom build ImmortalWrt untuk **ZTE E8820S (BREED Layout HC5962)** dengan konfigurasi bawaan dari folder `files/` dan `patch/`.
            - **Upgrade dari LuCI:** Gunakan `*-squashfs-sysupgrade.bin` (matikan centang *Keep settings*).
            - **Install lewat BREED Web:** Gunakan `*-squashfs-factory.bin` dengan layout **HC5962**.
          files: output/*
          
