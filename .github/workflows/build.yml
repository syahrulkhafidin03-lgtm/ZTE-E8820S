name: Build OpenWrt ZTE E8820S (BREED)

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Versi OpenWrt'
        required: true
        default: 'v25.12.6'
        type: choice
        options:
          - v25.12.6

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repo ZTE-E8820S
        uses: actions/checkout@v4

      - name: Bersihkan Ruang Disk Runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true
          df -h

      - name: Install Dependensi Kompilasi
        run: |
          sudo apt-get update
          sudo apt-get install -y ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache clang cmake cpio curl device-tree-compiler ecj fastjar flex gawk gettext gcc-multilib \
            g++-multilib git gnutls-dev gperf haveged help2man intltool lib32gcc-s1 libc6-dev-i386 libelf-dev \
            libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses-dev libpython3-dev \
            libreadline-dev libssl-dev libtool libyaml-dev libz-dev lld llvm lrzsz mkisofs msmtp nano \
            ninja-build p7zip p7zip-full patch pkgconf python3 python3-pip python3-ply python3-docutils \
            python3-pyelftools qemu-utils re2c rsync scons squashfs-tools subversion swig texinfo uglifyjs \
            upx-ucl unzip vim wget xmlto xxd zlib1g-dev zstd

      - name: Clone Source OpenWrt v25.12.6
        run: |
          git clone --depth=1 -b v25.12.6 https://github.com/openwrt/openwrt.git openwrt

      - name: Cache Source & Ccache
        uses: actions/cache@v4
        with:
          path: |
            openwrt/dl
            openwrt/.ccache
          key: openwrt-v25.12.6-official-${{ hashFiles('.github/workflows/build.yml') }}
          restore-keys: |
            openwrt-v25.12.6-official-

      - name: Update & Install Feeds
        working-directory: openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Terapkan Patch BREED, Max Performance, SmartDNS IX, NetTraffic & MWAN3
        working-directory: openwrt
        run: |
          # 1. Timpa DTS dengan peta partisi BREED dari folder patch/
          if [ -f ../patch/mt7621_zte_e8820s.dts ]; then
            cp -f ../patch/mt7621_zte_e8820s.dts target/linux/ramips/dts/mt7621_zte_e8820s.dts
          fi

          # 2. Ganti definisi zte_e8820s bawaan dengan versi BREED (patch/zte.txt)
          if [ -f ../patch/zte.txt ]; then
            python3 - <<'PY'
          import re
          mk_path = "target/linux/ramips/image/mt7621.mk"
          with open(mk_path, "r", encoding="utf-8") as f:
              content = f.read()
          content = re.sub(r"\ndefine Device/zte_e8820s\b.*?TARGET_DEVICES \+= zte_e8820s\s*", "\n", content, flags=re.DOTALL)
          with open("../patch/zte.txt", "r", encoding="utf-8") as f:
              zte_patch = f.read()
          with open(mk_path, "w", encoding="utf-8") as f:
              f.write(content.rstrip() + "\n\n" + zte_patch.strip() + "\n")
          PY
          fi

          # 3. Terapkan patch LED & Sysupgrade secara aman
          LEDS_FILE="target/linux/ramips/mt7621/base-files/etc/board.d/01_leds"
          UPGRADE_FILE="target/linux/ramips/mt7621/base-files/lib/upgrade/platform.sh"

          if ! grep -q "zte,e8820s" "$LEDS_FILE" && [ -f ../patch/leds.txt ]; then
            sed -i '/esac/e cat ../patch/leds.txt' "$LEDS_FILE"
          fi

          if ! grep -q "zte,e8820s" "$UPGRADE_FILE" && [ -f ../patch/upgrade.txt ]; then
            sed -i '/case "$board" in/r ../patch/upgrade.txt' "$UPGRADE_FILE"
          fi

          # 4. Kernel Sysctl Tuning (TCP BBR, fq_codel, Anti-Jitter & Proteksi RAM 256MB MT7621)
          mkdir -p package/base-files/files/etc/sysctl.d
          cat <<'SYSCTL_EOF' > package/base-files/files/etc/sysctl.d/99-performance.conf
          # --- TCP BBR & Fair Queue CoDel (Pipa Besar, Throughput Mentok, Anti-Bufferbloat) ---
          net.core.default_qdisc=fq_codel
          net.ipv4.tcp_congestion_control=bbr
          net.ipv4.tcp_fastopen=3
          net.ipv4.tcp_mtu_probing=1
          net.ipv4.tcp_slow_start_after_idle=0
          net.ipv4.tcp_no_metrics_save=1
          net.ipv4.tcp_notsent_lowat=16384
          net.ipv4.tcp_tw_reuse=1
          net.ipv4.tcp_fin_timeout=15
          net.ipv4.tcp_keepalive_time=120
          net.ipv4.tcp_keepalive_intvl=15
          net.ipv4.tcp_keepalive_probes=4

          # --- Buffer Jaringan, RPS Flow & NAPI Polling Optimal untuk MT7621AT ---
          net.core.rps_sock_flow_entries=32768
          net.core.netdev_max_backlog=4096
          net.core.netdev_budget=600
          net.core.netdev_budget_usecs=8000
          net.core.somaxconn=2048
          net.core.rmem_default=262144
          net.core.wmem_default=262144
          net.core.rmem_max=4194304
          net.core.wmem_max=4194304
          net.ipv4.tcp_rmem=4096 87380 4194304
          net.ipv4.tcp_wmem=4096 65536 4194304
          net.ipv4.udp_rmem_min=8192
          net.ipv4.udp_wmem_min=8192
          net.ipv4.neigh.default.gc_thresh1=256
          net.ipv4.neigh.default.gc_thresh2=1024
          net.ipv4.neigh.default.gc_thresh3=2048

          # --- Conntrack Multi-WAN Banyak Client & Perlindungan Kesehatan Device ---
          net.netfilter.nf_conntrack_max=32768
          net.netfilter.nf_conntrack_tcp_timeout_established=1200
          net.netfilter.nf_conntrack_tcp_timeout_time_wait=15
          net.netfilter.nf_conntrack_tcp_timeout_close_wait=15
          net.netfilter.nf_conntrack_tcp_timeout_fin_wait=30
          net.netfilter.nf_conntrack_udp_timeout=30
          net.netfilter.nf_conntrack_udp_timeout_stream=90

          # --- Manajemen Memori & Anti-OOM WiFi DMA ---
          vm.min_free_kbytes=16384
          vm.vfs_cache_pressure=150
          vm.dirty_background_ratio=5
          vm.dirty_ratio=10
          vm.swappiness=10
          SYSCTL_EOF

          # 5A. Wi-Fi Ultra Low-Latency AQL & Airtime Fairness (Serasa WiFi 6/7/8 Tanpa Spike)
          mkdir -p package/base-files/files/etc/hotplug.d/ieee80211
          cat <<'WIFI_AQL_EOF' > package/base-files/files/etc/hotplug.d/ieee80211/99-mt76-lowlatency
          #!/bin/sh
          [ "$ACTION" = "add" ] || exit 0
          for phy in /sys/kernel/debug/ieee80211/phy*; do
              [ -w "$phy/aql_enable" ] && echo 1 > "$phy/aql_enable" 2>/dev/null
              [ -w "$phy/airtime_flags" ] && echo 7 > "$phy/airtime_flags" 2>/dev/null
              if [ -w "$phy/aql_txq_limit" ]; then
                  echo "0 1000 2000" > "$phy/aql_txq_limit" 2>/dev/null
                  echo "1 1500 3000" > "$phy/aql_txq_limit" 2>/dev/null
                  echo "2 2500 5000" > "$phy/aql_txq_limit" 2>/dev/null
                  echo "3 1500 3000" > "$phy/aql_txq_limit" 2>/dev/null
              fi
          done
          WIFI_AQL_EOF
          chmod 755 package/base-files/files/etc/hotplug.d/ieee80211/99-mt76-lowlatency

          # 5B. SMP 4-Thread CPU Packet Steering (RPS/XPS) untuk Semua Interface (LAN/WAN/USB/WWAN/WiFi)
          mkdir -p package/base-files/files/etc/hotplug.d/net
          cat <<'SMP_RPS_EOF' > package/base-files/files/etc/hotplug.d/net/20-smp-rps-xps
          #!/bin/sh
          [ "$ACTION" = "add" ] || [ "$ACTION" = "register" ] || exit 0
          [ -n "$INTERFACE" ] || exit 0
          [ "$INTERFACE" = "lo" ] && exit 0

          DEV_PATH="/sys/class/net/$INTERFACE"
          [ -d "$DEV_PATH" ] || exit 0

          for rxq in "$DEV_PATH"/queues/rx-*; do
              [ -w "$rxq/rps_cpus" ] && echo "f" > "$rxq/rps_cpus" 2>/dev/null
              [ -w "$rxq/rps_flow_cnt" ] && echo "4096" > "$rxq/rps_flow_cnt" 2>/dev/null
          done

          for txq in "$DEV_PATH"/queues/tx-*; do
              [ -w "$txq/xps_cpus" ] && echo "f" > "$txq/xps_cpus" 2>/dev/null
          done
          SMP_RPS_EOF
          chmod 755 package/base-files/files/etc/hotplug.d/net/20-smp-rps-xps

          # 5C. Auto-QoS DSCP Gaming & Interactive Prioritization (WMM AC_VO Hardware Queue)
          mkdir -p package/base-files/files/etc/nftables.d
          cat <<'NFT_QOS_EOF' > package/base-files/files/etc/nftables.d/99-gaming-qos.nft
          chain mangle_postrouting_qos {
              type filter hook postrouting priority mangle; policy accept;
              # Prioritaskan paket UDP Gaming, DNS, dan ICMP ke antrean WMM tertinggi (EF / AC_VO)
              udp dport { 53, 5000-5600, 7000-9000, 10000-20000, 27000-27100, 30000-30100 } ip dscp set ef counter
              udp sport { 53, 5000-5600, 7000-9000, 10000-20000, 27000-27100, 30000-30100 } ip dscp set ef counter
              ip protocol icmp ip dscp set cs6 counter
          }
          NFT_QOS_EOF
          chmod 644 package/base-files/files/etc/nftables.d/99-gaming-qos.nft

          # 6. Deep Maintenance & Auto Garbage Cleaner Setiap Jam 03:00 Pagi
          mkdir -p package/base-files/files/usr/bin
          cat <<'FREERAM_EOF' > package/base-files/files/usr/bin/freeram.sh
          #!/bin/sh
          # Deep Maintenance & Auto Cleaner (RAM, Cache, Log, ARP, Conntrack & DNS Refresh)
          MEM_BEFORE=$(awk '/MemAvailable:/ {print $2}' /proc/meminfo 2>/dev/null)

          # 1. Flush disk buffers & bersihkan Linux PageCache, Dentries, Inodes
          sync
          echo 3 > /proc/sys/vm/drop_caches 2>/dev/null
          [ -w /proc/sys/vm/compact_memory ] && echo 1 > /proc/sys/vm/compact_memory 2>/dev/null

          # 2. Bersihkan seluruh log & file sampah sementara di /tmp
          rm -rf /tmp/log/* /tmp/*.log /tmp/*.tmp /tmp/luci-modulecache/* /tmp/luci-indexcache* 2>/dev/null

          # 3. Bersihkan tabel ARP/Neighbor mati & koneksi NAT usang
          ip -s -s neigh flush all >/dev/null 2>&1 || true
          command -v conntrack >/dev/null 2>&1 && conntrack -F >/dev/null 2>&1 || true

          # 4. Segarkan memori DNS tanpa memutus koneksi internet
          /etc/init.d/smartdns reload >/dev/null 2>&1 || true
          /etc/init.d/dnsmasq reload >/dev/null 2>&1 || true

          sync
          MEM_AFTER=$(awk '/MemAvailable:/ {print $2}' /proc/meminfo 2>/dev/null)
          logger -t maintenance "03:00 Auto-Clean selesai: RAM tersedia ${MEM_BEFORE}kB -> ${MEM_AFTER}kB (Log, Cache, ARP & Conntrack dibersihkan)"
          FREERAM_EOF
          chmod 755 package/base-files/files/usr/bin/freeram.sh

          # 7. Tanamkan Custom Package: luci-app-nettraffic
          mkdir -p package/base-files/files/etc/config \
                   package/base-files/files/etc/init.d \
                   package/base-files/files/etc/uci-defaults \
                   package/base-files/files/usr/libexec/rpcd \
                   package/base-files/files/usr/share/luci/menu.d \
                   package/base-files/files/usr/share/rpcd/acl.d \
                   package/base-files/files/www/luci-static/resources/view/nettraffic

          cat <<'NT_CONF_EOF' > package/base-files/files/etc/config/nettraffic
          config settings 'settings'
          	option interval '2'
          	option save_interval '60'
          	option history '60'
          	option ports 'wan'
          NT_CONF_EOF
          chmod 644 package/base-files/files/etc/config/nettraffic

          cat <<'NT_INIT_EOF' > package/base-files/files/etc/init.d/nettraffic
          #!/bin/sh /etc/rc.common

          START=95
          STOP=10
          USE_PROCD=1

          start_service() {
          	mkdir -p /var/run/nettraffic /etc/nettraffic

          	procd_open_instance
          	procd_set_param command /usr/libexec/nettrafficd
          	procd_set_param respawn 3600 5 5
          	procd_set_param stdout 0
          	procd_set_param stderr 0
          	procd_close_instance
          }

          reload_service() {
          	restart
          }
          NT_INIT_EOF
          chmod 755 package/base-files/files/etc/init.d/nettraffic

          cat <<'NT_UCI_EOF' > package/base-files/files/etc/uci-defaults/90_luci-app-nettraffic
          #!/bin/sh

          mkdir -p /etc/nettraffic

          touch /etc/sysupgrade.conf 2>/dev/null || true
          if [ -f /etc/sysupgrade.conf ] && ! grep -q '^/etc/nettraffic/' /etc/sysupgrade.conf 2>/dev/null; then
          	echo '/etc/nettraffic/' >> /etc/sysupgrade.conf
          fi

          /etc/init.d/nettraffic enable >/dev/null 2>&1 || true
          /etc/init.d/rpcd restart >/dev/null 2>&1 || true
          exit 0
          NT_UCI_EOF
          chmod 755 package/base-files/files/etc/uci-defaults/90_luci-app-nettraffic

          cat <<'NT_RPCD_EOF' > package/base-files/files/usr/libexec/rpcd/nettraffic
          #!/bin/sh
          RUN_DIR="${NETTRAFFIC_RUN_DIR:-/var/run/nettraffic}"
          STATUS_FILE="$RUN_DIR/status.json"
          PID_FILE="$RUN_DIR/pid"

          case "$1" in
          	list)
          		printf '%s\n' '{"status":{},"reset":{}}'
          		;;
          	call)
          		case "$2" in
          			status)
          				if [ -s "$STATUS_FILE" ]; then
          					cat "$STATUS_FILE"
          				else
          					cat <<'EOF'
          {"ok":false,"error":"Monitor belum berjalan","wan_detected":false,"interfaces":[],"ifaces":[],"usb_found":false,"uplinks":[],"rx_rate":0,"tx_rate":0,"rx_total":0,"tx_total":0,"day_rx":0,"day_tx":0,"month_rx":0,"month_tx":0,"ports":[],"system":null,"history":[],"interval":2,"save_interval":60}
          EOF
          				fi
          				;;
          			reset)
          				_pid=""
          				[ -s "$PID_FILE" ] && read -r _pid < "$PID_FILE" 2>/dev/null
          				if [ -n "$_pid" ] && kill -0 "$_pid" 2>/dev/null; then
          					kill -USR1 "$_pid" 2>/dev/null
          					printf '%s\n' '{"ok":true}'
          				else
          					printf '%s\n' '{"ok":false,"error":"Monitor tidak berjalan"}'
          				fi
          				;;
          			*)
          				printf '%s\n' '{"ok":false,"error":"Metode tidak dikenal"}'
          				;;
          		esac
          		;;
          esac
          NT_RPCD_EOF
          chmod 755 package/base-files/files/usr/libexec/rpcd/nettraffic

          cat <<'NT_DAEMON_EOF' > package/base-files/files/usr/libexec/nettrafficd
          #!/bin/sh
          PATH="${NETTRAFFIC_PATH:-/usr/sbin:/usr/bin:/sbin:/bin}"
          export PATH

          umask 022

          STATE_DIR="${NETTRAFFIC_STATE_DIR:-/etc/nettraffic}"
          RUN_DIR="${NETTRAFFIC_RUN_DIR:-/var/run/nettraffic}"
          SYS_NET="${NETTRAFFIC_SYS_CLASS_NET:-/sys/class/net}"
          UPTIME_FILE="${NETTRAFFIC_UPTIME_FILE:-/proc/uptime}"

          STATE_FILE="$STATE_DIR/state"
          DEVFILE="$RUN_DIR/devices"
          PORTS_FILE="$RUN_DIR/ports"
          STATUS_FILE="$RUN_DIR/status.json"
          PIDFILE="$RUN_DIR/pid"
          HISTFILE="$RUN_DIR/history"
          HIST_STATE_FILE="$STATE_DIR/history"
          IFHIST_DIR="$RUN_DIR/ifhist"
          IFHIST_STATE_DIR="$STATE_DIR/ifhist"
          RATES_FILE="$RUN_DIR/rates"
          WANINFO_FILE="$RUN_DIR/waninfo"
          SYSINFO_FILE="$RUN_DIR/system.json"

          INTERVAL=2
          SAVE_INTERVAL=60
          HISTORY_LEN=60
          SYSINFO_INTERVAL=10
          CONF_IFACES=""
          CONF_PORTS=""
          MON_DEVS=""
          USB_DEVS=""

          log() {
          	logger -t nettraf "$*" 2>/dev/null || true
          }

          is_uint() {
          	case "$1" in
          		''|*[!0-9]*) return 1 ;;
          		*) return 0 ;;
          	esac
          }

          is_num() {
          	case "$1" in
          		''|*[!0-9.]*) return 1 ;;
          		*.*.*) return 1 ;;
          	esac
          	return 0
          }

          read_uptime() {
          	UPTIME=""
          	if [ -r "$UPTIME_FILE" ]; then
          		read -r UPTIME _ < "$UPTIME_FILE" 2>/dev/null || true
          	fi
          	case "$UPTIME" in
          		''|*[!0-9.]*) UPTIME="$(date +%s)" ;;
          	esac
          }

          is_later_date() {
          	[ -n "$1" ] && [ -n "$2" ] && [ "$1" != "$2" ] || return 1
          	[ "$(printf '%s\n%s\n' "$1" "$2" | sort | tail -n 1)" = "$1" ]
          }

          is_plausible_date() {
          	case "$1" in
          		20[2-9][0-9]-*) return 0 ;;
          		*) return 1 ;;
          	esac
          }

          uci_get() {
          	uci -q get "nettraffic.settings.$1" 2>/dev/null
          }

          load_config() {
          	_v="$(uci_get interval)"
          	is_uint "$_v" && [ "$_v" -ge 1 ] && [ "$_v" -le 60 ] && INTERVAL="$_v"

          	_v="$(uci_get save_interval)"
          	is_uint "$_v" && [ "$_v" -ge 15 ] && [ "$_v" -le 3600 ] && SAVE_INTERVAL="$_v"

          	_v="$(uci_get history)"
          	is_uint "$_v" && [ "$_v" -ge 20 ] && [ "$_v" -le 300 ] && HISTORY_LEN="$_v"

          	_v="$(uci_get interfaces)"
          	[ -n "$_v" ] && CONF_IFACES="$_v"

          	_v="$(uci_get ports)"
          	[ -n "$_v" ] && CONF_PORTS="$_v"

          	[ -n "$NETTRAFFIC_INTERVAL" ] && INTERVAL="$NETTRAFFIC_INTERVAL"
          	[ -n "$NETTRAFFIC_INTERFACES" ] && CONF_IFACES="$NETTRAFFIC_INTERFACES"
          	[ -n "$NETTRAFFIC_PORTS" ] && CONF_PORTS="$NETTRAFFIC_PORTS"
          }

          add_wan() {
          	_d="$1"
          	[ -n "$_d" ] || return 0
          	[ "$_d" = "br-lan" ] && return 0
          	[ "$_d" = "wan" ] && return 0
          	[ -d "$SYS_NET/$_d" ] || return 0
          	case " $WAN_DEVS " in
          		*" $_d "*) return 0 ;;
          	esac
          	WAN_DEVS="$WAN_DEVS $_d"
          }

          detect_wan() {
          	WAN_DEVS=""

          	if [ -n "$CONF_IFACES" ]; then
          		for _d in $CONF_IFACES; do
          			add_wan "$_d"
          		done
          		return 0
          	fi

          	if command -v ip >/dev/null 2>&1; then
          		_devs="$(ip route show default 2>/dev/null | \
          			awk '{ for (i = 1; i <= NF; i++) if ($i == "dev") { print $(i + 1); break } }')"
          		for _d in $_devs; do
          			add_wan "$_d"
          		done
          	fi

          	if command -v ubus >/dev/null 2>&1; then
          		for _if in wan1 wan2 wan3 wan4 wanusb wwan wwan2 wan6 wan_6; do
          			_l3="$(ubus call "network.interface.$_if" status 2>/dev/null | \
          				sed -n 's/.*"l3_device"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' | \
          				head -n 1)"
          			add_wan "$_l3"
          		done
          	fi

          	if [ -z "$WAN_DEVS" ] && command -v uci >/dev/null 2>&1; then
          		for _if in wan1 wan2 wan3 wan4 wanusb wwan wwan2; do
          			_d="$(uci -q get "network.$_if.device" 2>/dev/null)"
          			[ -n "$_d" ] || _d="$(uci -q get "network.$_if.ifname" 2>/dev/null)"
          			add_wan "$_d"
          		done
          	fi
          }

          add_mon() {
          	_d="$1"
          	[ -n "$_d" ] || return 0
          	[ -d "$SYS_NET/$_d" ] || return 0
          	case " $MON_DEVS " in
          		*" $_d "*) return 0 ;;
          	esac
          	MON_DEVS="$MON_DEVS $_d"
          }

          is_wan_dev() {
          	case " $WAN_DEVS " in
          		*" $1 "*) return 0 ;;
          	esac
          	return 1
          }

          is_usb_dev() {
          	case " $USB_DEVS " in
          		*" $1 "*) return 0 ;;
          	esac
          	return 1
          }

          detect_usb() {
          	USB_DEVS=""
          	for _p in "$SYS_NET"/*; do
          		[ -d "$_p" ] || continue
          		_d="${_p##*/}"
          		case "$_d" in
          			lo|phy*|wlan*|'') continue ;;
          		esac
          		_usb=0
          		case "$_d" in
          			usb*|wwan*|rndis*) _usb=1 ;;
          		esac
          		if [ "$_usb" = 0 ] && [ -e "$_p/device" ]; then
          			_real="$(readlink -f "$_p/device" 2>/dev/null)"
          			case "$_real" in
          				*/usb*) _usb=1 ;;
          			esac
          		fi
          		[ "$_usb" = 1 ] || continue
          		USB_DEVS="$USB_DEVS $_d"
          	done
          	USB_DEVS="${USB_DEVS# }"
          }

          detect_monitors() {
          	MON_DEVS=""
          	add_mon wan
          	for _n in 1 2 3 4; do
          		add_mon "lan$_n"
          	done
          	for _d in $CONF_PORTS; do
          		add_mon "$_d"
          	done
          	add_mon br-lan
          	detect_usb
          	for _d in $USB_DEVS; do
          		add_mon "$_d"
          	done
          	for _d in $WAN_DEVS; do
          		add_mon "$_d"
          	done
          	MON_DEVS="${MON_DEVS# }"
          }

          read_bytes() {
          	R_RX=0
          	R_TX=0
          	read -r R_RX < "$SYS_NET/$1/statistics/rx_bytes" 2>/dev/null || true
          	read -r R_TX < "$SYS_NET/$1/statistics/tx_bytes" 2>/dev/null || true
          	is_uint "$R_RX" || R_RX=0
          	is_uint "$R_TX" || R_TX=0
          }

          get_dev() {
          	[ -s "$DEVFILE" ] || return 1
          	while IFS='|' read -r _d _tr _tt _lr _lt; do
          		[ -n "$_d" ] || continue
          		if [ "$_d" = "$1" ]; then
          			printf '%s %s %s %s\n' "$_tr" "$_tt" "$_lr" "$_lt"
          			return 0
          		fi
          	done < "$DEVFILE"
          	return 1
          }

          put_dev() {
          	_tmp="$DEVFILE.$$.tmp"
          	_found=0
          	[ -f "$DEVFILE" ] || : > "$DEVFILE"
          	while IFS='|' read -r _d _tr _tt _lr _lt; do
          		[ -n "$_d" ] || continue
          		if [ "$_d" = "$1" ]; then
          			printf '%s|%s|%s|%s|%s\n' "$1" "$2" "$3" "$4" "$5"
          			_found=1
          		else
          			printf '%s|%s|%s|%s|%s\n' "$_d" "$_tr" "$_tt" "$_lr" "$_lt"
          		fi
          	done < "$DEVFILE" > "$_tmp"
          	[ "$_found" -eq 0 ] && printf '%s|%s|%s|%s|%s\n' "$1" "$2" "$3" "$4" "$5" >> "$_tmp"
          	mv -f "$_tmp" "$DEVFILE"
          }

          sum_devices() {
          	[ -s "$DEVFILE" ] || return 0
          	TOTAL_RX=0
          	TOTAL_TX=0
          	while IFS='|' read -r _d _tr _tt _lr _lt; do
          		[ -n "$_d" ] || continue
          		is_wan_dev "$_d" || continue
          		is_uint "$_tr" || _tr=0
          		is_uint "$_tt" || _tt=0
          		TOTAL_RX=$((TOTAL_RX + _tr))
          		TOTAL_TX=$((TOTAL_TX + _tt))
          	done < "$DEVFILE"
          }

          check_periods() {
          	_day="$(date +%Y-%m-%d 2>/dev/null)"
          	_month="${_day%-*}"

          	if is_plausible_date "$_day"; then
          		if [ -z "$DAY" ]; then
          			DAY="$_day"
          		elif is_later_date "$_day" "$DAY"; then
          			DAY="$_day"
          			DAY_RX=0
          			DAY_TX=0
          		fi
          	fi

          	if is_plausible_date "$_month"; then
          		if [ -z "$MONTH" ]; then
          			MONTH="$_month"
          		elif is_later_date "$_month" "$MONTH"; then
          			MONTH="$_month"
          			MONTH_RX=0
          			MONTH_TX=0
          		fi
          	fi
          }

          load_state() {
          	[ -f "$STATE_FILE" ] || return 0
          	[ -f "$DEVFILE" ] && : > "$DEVFILE"

          	while IFS= read -r _line; do
          		case "$_line" in
          			total_rx=*) TOTAL_RX="${_line#*=}" ;;
          			total_tx=*) TOTAL_TX="${_line#*=}" ;;
          			saved_at=*) SAVED_AT="${_line#*=}" ;;
          			day=*) DAY="${_line#*=}" ;;
          			day_rx=*) DAY_RX="${_line#*=}" ;;
          			day_tx=*) DAY_TX="${_line#*=}" ;;
          			month=*) MONTH="${_line#*=}" ;;
          			month_rx=*) MONTH_RX="${_line#*=}" ;;
          			month_tx=*) MONTH_TX="${_line#*=}" ;;
          			dev\|*) printf '%s\n' "${_line#dev|}" >> "$DEVFILE" ;;
          		esac
          	done < "$STATE_FILE"

          	is_uint "$TOTAL_RX" || TOTAL_RX=0
          	is_uint "$TOTAL_TX" || TOTAL_TX=0
          	is_uint "$DAY_RX" || DAY_RX=0
          	is_uint "$DAY_TX" || DAY_TX=0
          	is_uint "$MONTH_RX" || MONTH_RX=0
          	is_uint "$MONTH_TX" || MONTH_TX=0
          	is_uint "$SAVED_AT" || SAVED_AT=0
          }

          save_state() {
          	_now="$(date +%s)"
          	_tmp="$STATE_FILE.$$.tmp"
          	{
          		printf 'version=1\n'
          		printf 'saved_at=%s\n' "$_now"
          		printf 'total_rx=%s\n' "$TOTAL_RX"
          		printf 'total_tx=%s\n' "$TOTAL_TX"
          		printf 'day=%s\n' "$DAY"
          		printf 'day_rx=%s\n' "$DAY_RX"
          		printf 'day_tx=%s\n' "$DAY_TX"
          		printf 'month=%s\n' "$MONTH"
          		printf 'month_rx=%s\n' "$MONTH_RX"
          		printf 'month_tx=%s\n' "$MONTH_TX"
          		if [ -s "$DEVFILE" ]; then
          			while IFS='|' read -r _d _tr _tt _lr _lt; do
          				[ -n "$_d" ] || continue
          				printf 'dev|%s|%s|%s|%s|%s\n' "$_d" "$_tr" "$_tt" "$_lr" "$_lt"
          			done < "$DEVFILE"
          		fi
          	} > "$_tmp" || {
          		rm -f "$_tmp"
          		return 1
          	}
          	mv -f "$_tmp" "$STATE_FILE" || {
          		rm -f "$_tmp"
          		return 1
          	}
          	persist_history
          	sync 2>/dev/null || true
          	SAVED_AT="$_now"
          }

          restore_history() {
          	mkdir -p "$IFHIST_DIR" "$IFHIST_STATE_DIR" 2>/dev/null || true
          	if [ -s "$HIST_STATE_FILE" ]; then
          		tail -n "$HISTORY_LEN" "$HIST_STATE_FILE" > "$HISTFILE" 2>/dev/null || true
          	fi
          	for _f in "$IFHIST_STATE_DIR"/*; do
          		[ -f "$_f" ] || continue
          		_n="${_f##*/}"
          		tail -n "$HISTORY_LEN" "$_f" > "$IFHIST_DIR/$_n" 2>/dev/null || true
          	done
          }

          persist_history() {
          	[ -f "$HISTFILE" ] || : > "$HISTFILE"
          	_tmp="$HIST_STATE_FILE.$$.tmp"
          	if cp -f "$HISTFILE" "$_tmp" 2>/dev/null; then
          		mv -f "$_tmp" "$HIST_STATE_FILE" 2>/dev/null || rm -f "$_tmp"
          	fi
          	mkdir -p "$IFHIST_STATE_DIR" 2>/dev/null || return 0
          	for _f in "$IFHIST_DIR"/*; do
          		[ -f "$_f" ] || continue
          		_n="${_f##*/}"
          		_tmp="$IFHIST_STATE_DIR/$_n.$$.tmp"
          		if cp -f "$_f" "$_tmp" 2>/dev/null; then
          			mv -f "$_tmp" "$IFHIST_STATE_DIR/$_n" 2>/dev/null || rm -f "$_tmp"
          		fi
          	done
          }

          append_hist() {
          	[ -n "$1" ] || return 0
          	printf '%s %s\n' "$2" "$3" >> "$1" 2>/dev/null || return 0
          	_tmp="$1.$$.tmp"
          	tail -n "$HISTORY_LEN" "$1" > "$_tmp" 2>/dev/null && mv -f "$_tmp" "$1" || rm -f "$_tmp"
          }

          json_history() {
          	[ -s "$1" ] || { printf '[]'; return 0; }
          	awk 'BEGIN { printf "[" } { printf "%s[%s,%s]", (NR > 1 ? "," : ""), ($1 + 0), ($2 + 0) } END { printf "]" }' "$1" 2>/dev/null
          }

          port_add() {
          	_label="$1"
          	_dev="$2"
          	_file="$3"

          	_carrier=""
          	_oper=""
          	_speed=""
          	_duplex=""
          	read -r _carrier < "$SYS_NET/$_dev/carrier" 2>/dev/null || true
          	read -r _oper < "$SYS_NET/$_dev/operstate" 2>/dev/null || true
          	read -r _speed < "$SYS_NET/$_dev/speed" 2>/dev/null || true
          	read -r _duplex < "$SYS_NET/$_dev/duplex" 2>/dev/null || true

          	_up=0
          	if [ "$_carrier" = "1" ] || [ "$_oper" = "up" ]; then
          		_up=1
          	fi
          	is_uint "$_speed" || _speed=0
          	case "$_duplex" in
          		full|half|unknown) ;;
          		*) _duplex="" ;;
          	esac

          	printf '%s|%s|%s|%s|%s\n' "$_label" "$_dev" "$_up" "$_speed" "$_duplex" >> "$_file"
          }

          collect_ports() {
          	_tmp="$PORTS_FILE.$$.tmp"
          	: > "$_tmp"

          	if [ -d "$SYS_NET/wan" ]; then
          		port_add "LAN (Port WAN)" "wan" "$_tmp"
          	fi
          	for _n in 1 2 3 4; do
          		_dev="lan$_n"
          		if [ -d "$SYS_NET/$_dev" ]; then
          			port_add "WAN $_n (LAN$_n)" "$_dev" "$_tmp"
          		fi
          	done

          	mv -f "$_tmp" "$PORTS_FILE"
          }

          get_rate() {
          	[ -s "$RATES_FILE" ] || { printf '0 0\n'; return 0; }
          	while IFS='|' read -r _rd _rr _rt; do
          		[ -n "$_rd" ] || continue
          		if [ "$_rd" = "$1" ]; then
          			is_num "$_rr" || _rr=0
          			is_num "$_rt" || _rt=0
          			printf '%s %s\n' "$_rr" "$_rt"
          			return 0
          		fi
          	done < "$RATES_FILE"
          	printf '0 0\n'
          }

          collect_wan_info() {
          	_tmp="$WANINFO_FILE.$$.tmp"
          	: > "$_tmp"
          	if command -v ip >/dev/null 2>&1; then
          		ip route show default 2>/dev/null | awk '
          			{
          				dev = ""; gw = ""; met = 9999
          				for (i = 1; i <= NF; i++) {
          					if ($i == "via") gw = $(i + 1)
          					else if ($i == "dev") dev = $(i + 1)
          					else if ($i == "metric") met = $(i + 1)
          				}
          				if (dev == "") next
          				if (met !~ /^[0-9]+$/) met = 9999
          				if (!(dev in best) || met + 0 < best[dev] + 0) {
          					best[dev] = met
          					gwf[dev] = gw
          				}
          			}
          			END {
          				for (d in best)
          					printf "%s|%s|%s\n", d, gwf[d], best[d]
          			}
          		' > "$_tmp"
          	fi
          	mv -f "$_tmp" "$WANINFO_FILE"
          }

          collect_system() {
          	_load1=0; _load5=0; _load15=0
          	if [ -r /proc/loadavg ]; then
          		read -r _load1 _load5 _load15 _rest < /proc/loadavg 2>/dev/null || true
          	fi
          	is_num "$_load1" || _load1=0
          	is_num "$_load5" || _load5=0
          	is_num "$_load15" || _load15=0

          	_mem_total=0; _mem_avail=0; _mem_free=0; _mem_buff=0; _mem_cache=0
          	if [ -r /proc/meminfo ]; then
          		while read -r _k _v _u; do
          			case "$_k" in
          				MemTotal:) _mem_total="$_v" ;;
          				MemAvailable:) _mem_avail="$_v" ;;
          				MemFree:) _mem_free="$_v" ;;
          				Buffers:) _mem_buff="$_v" ;;
          				Cached:) _mem_cache="$_v" ;;
          			esac
          		done < /proc/meminfo
          	fi
          	is_uint "$_mem_total" || _mem_total=0
          	is_uint "$_mem_avail" || _mem_avail=0
          	if [ "$_mem_avail" -eq 0 ]; then
          		is_uint "$_mem_free" || _mem_free=0
          		is_uint "$_mem_buff" || _mem_buff=0
          		is_uint "$_mem_cache" || _mem_cache=0
          		_mem_avail=$((_mem_free + _mem_buff + _mem_cache))
          	fi
          	_mem_used=$((_mem_total - _mem_avail))
          	[ "$_mem_used" -lt 0 ] && _mem_used=0
          	_mem_pct=0
          	[ "$_mem_total" -gt 0 ] && _mem_pct=$((_mem_used * 100 / _mem_total))

          	_temp=""
          	for _f in /sys/class/thermal/thermal_zone*/temp /sys/class/hwmon/hwmon*/temp1_input; do
          		[ -r "$_f" ] || continue
          		read -r _v < "$_f" 2>/dev/null || continue
          		is_uint "$_v" || continue
          		[ "$_v" -gt 0 ] || continue
          		_temp="$_v"
          		break
          	done
          	_temp_c="null"
          	if is_uint "$_temp"; then
          		if [ "$_temp" -ge 1000 ]; then
          			_temp_c="$(awk -v v="$_temp" 'BEGIN { printf "%.1f", v / 1000 }')"
          		else
          			_temp_c="$_temp"
          		fi
          	fi

          	_flash_line="$(df -k /overlay 2>/dev/null | awk 'NR == 2 { gsub(/%/, "", $5); print $2, $3, $4, $5 }')"
          	[ -n "$_flash_line" ] || \
          		_flash_line="$(df -k / 2>/dev/null | awk 'NR == 2 { gsub(/%/, "", $5); print $2, $3, $4, $5 }')"
          	_flash_total=0; _flash_used=0; _flash_pct=0
          	set -- $_flash_line
          	[ -n "$1" ] && _flash_total="$1"
          	[ -n "$2" ] && _flash_used="$2"
          	[ -n "$4" ] && _flash_pct="$4"
          	is_uint "$_flash_total" || _flash_total=0
          	is_uint "$_flash_used" || _flash_used=0
          	is_uint "$_flash_pct" || _flash_pct=0

          	_wifi_clients=0
          	_wifi_ifaces=""
          	_wifi_available=false
          	if command -v iw >/dev/null 2>&1; then
          		_wifi_available=true
          		for _w in $(iw dev 2>/dev/null | awk '/Interface/ { print $2 }'); do
          			_c="$(iw dev "$_w" station dump 2>/dev/null | grep -c '^Station')"
          			is_uint "$_c" || _c=0
          			_wifi_clients=$((_wifi_clients + _c))
          			[ -n "$_wifi_ifaces" ] && _wifi_ifaces="$_wifi_ifaces, "
          			_wifi_ifaces="$_wifi_ifaces\"$_w\""
          		done
          	fi

          	_tmp="$SYSINFO_FILE.$$.tmp"
          	printf '{"load": [%s, %s, %s], "mem_total_kb": %s, "mem_used_kb": %s, "mem_percent": %s, "temp_c": %s, "flash_total_kb": %s, "flash_used_kb": %s, "flash_percent": %s, "wifi_clients": %s, "wifi_available": %s, "wifi_ifaces": [%s]}\n' \
          		"$_load1" "$_load5" "$_load15" \
          		"$_mem_total" "$_mem_used" "$_mem_pct" \
          		"$_temp_c" \
          		"$_flash_total" "$_flash_used" "$_flash_pct" \
          		"$_wifi_clients" "$_wifi_available" "$_wifi_ifaces" > "$_tmp" || {
          		rm -f "$_tmp"
          		return 1
          	}
          	mv -f "$_tmp" "$SYSINFO_FILE"
          }

          write_status() {
          	_rx_rate="$1"
          	_tx_rate="$2"
          	_now="$(date +%s)"
          	read_uptime
          	_uptime="${UPTIME%%.*}"

          	_wan_list=""
          	for _d in $WAN_DEVS; do
          		[ -n "$_wan_list" ] && _wan_list="$_wan_list,"
          		_wan_list="$_wan_list\"$_d\""
          	done

          	_wan_ok=false
          	[ -n "$WAN_DEVS" ] && _wan_ok=true

          	_ports=""
          	if [ -s "$PORTS_FILE" ]; then
          		while IFS='|' read -r _label _dev _up _speed _duplex; do
          			[ -n "$_label" ] || continue
          			[ -n "$_ports" ] && _ports="$_ports,"
          			if [ "$_up" = "1" ]; then
          				_up_json=true
          			else
          				_up_json=false
          			fi
          			is_uint "$_speed" || _speed=0
          			_ports="$_ports{\"label\":\"$_label\",\"device\":\"$_dev\",\"up\":$_up_json,\"speed\":$_speed,\"duplex\":\"$_duplex\"}"
          		done < "$PORTS_FILE"
          	fi

          	_min_metric=999999
          	if [ -s "$WANINFO_FILE" ]; then
          		while IFS='|' read -r _wd _wg _wm; do
          			case " $WAN_DEVS " in
          				*" $_wd "*) ;;
          				*) continue ;;
          			esac
          			is_uint "$_wm" || continue
          			[ "$_wm" -lt "$_min_metric" ] && _min_metric="$_wm"
          		done < "$WANINFO_FILE"
          	fi

          	_uplinks=""
          	for _d in $WAN_DEVS; do
          		_carrier=""; _oper=""; _speed=""; _duplex=""
          		read -r _carrier < "$SYS_NET/$_d/carrier" 2>/dev/null || true
          		read -r _oper < "$SYS_NET/$_d/operstate" 2>/dev/null || true
          		read -r _speed < "$SYS_NET/$_d/speed" 2>/dev/null || true
          		read -r _duplex < "$SYS_NET/$_d/duplex" 2>/dev/null || true

          		_up_json=false
          		if [ "$_carrier" = "1" ] || [ "$_oper" = "up" ]; then
          			_up_json=true
          		fi
          		is_uint "$_speed" || _speed=0
          		case "$_duplex" in
          			full|half|unknown) ;;
          			*) _duplex="" ;;
          		esac

          		_addr=""
          		if command -v ip >/dev/null 2>&1; then
          			_addr="$(ip addr show dev "$_d" 2>/dev/null | \
          				awk '/inet / { print $2; exit }')"
          		fi

          		_gw=""; _metric=0
          		if [ -s "$WANINFO_FILE" ]; then
          			while IFS='|' read -r _wd _wg _wm; do
          				if [ "$_wd" = "$_d" ]; then
          					_gw="$_wg"
          					_metric="$_wm"
          					break
          				fi
          			done < "$WANINFO_FILE"
          		fi
          		is_uint "$_metric" || _metric=0

          		_active=false
          		if [ "$_metric" -gt 0 ] && [ "$_metric" -lt 9999 ] && \
          		   [ "$_metric" -eq "$_min_metric" ]; then
          			_active=true
          		fi

          		_tr=0; _tt=0
          		_st="$(get_dev "$_d")"
          		if [ -n "$_st" ]; then
          			set -- $_st
          			_tr="$1"
          			_tt="$2"
          			is_uint "$_tr" || _tr=0
          			is_uint "$_tt" || _tt=0
          		fi

          		_rr=0; _rt=0
          		_rs="$(get_rate "$_d")"
          		if [ -n "$_rs" ]; then
          			set -- $_rs
          			_rr="$1"
          			_rt="$2"
          			is_num "$_rr" || _rr=0
          			is_num "$_rt" || _rt=0
          		fi

          		[ -n "$_uplinks" ] && _uplinks="$_uplinks,"
          		_uplinks="$_uplinks{\"device\":\"$_d\",\"up\":$_up_json,\"speed\":$_speed,\"duplex\":\"$_duplex\",\"address\":\"$_addr\",\"gateway\":\"$_gw\",\"metric\":$_metric,\"active\":$_active,\"rx_rate\":$_rr,\"tx_rate\":$_rt,\"rx_total\":$_tr,\"tx_total\":$_tt}"
          	done

          	_usb_found=false
          	[ -n "$USB_DEVS" ] && _usb_found=true

          	_iface_cards=""
          	for _d in $MON_DEVS; do
          		_carrier=""; _oper=""; _speed=""; _duplex=""
          		read -r _carrier < "$SYS_NET/$_d/carrier" 2>/dev/null || true
          		read -r _oper < "$SYS_NET/$_d/operstate" 2>/dev/null || true
          		read -r _speed < "$SYS_NET/$_d/speed" 2>/dev/null || true
          		read -r _duplex < "$SYS_NET/$_d/duplex" 2>/dev/null || true

          		_up_json=false
          		if [ "$_carrier" = "1" ] || [ "$_oper" = "up" ]; then
          			_up_json=true
          		fi
          		is_uint "$_speed" || _speed=0
          		case "$_duplex" in
          			full|half|unknown) ;;
          			*) _duplex="" ;;
          		esac

          		_label=""
          		_kind="other"
          		case "$_d" in
          			wan) _label="Port WAN (LAN)"; _kind="lan" ;;
          			lan1) _label="WAN 1 (LAN1)"; _kind="wan" ;;
          			lan2) _label="WAN 2 (LAN2)"; _kind="wan" ;;
          			lan3) _label="WAN 3 (LAN3)"; _kind="wan" ;;
          			lan4) _label="WAN 4 (LAN4)"; _kind="wan" ;;
          			br-lan) _label="br-lan"; _kind="bridge" ;;
          			usb*) _label="USB"; _kind="usb" ;;
          			wwan*) _label="USB Modem"; _kind="usb" ;;
          			*) _label="$_d"; _kind="other" ;;
          		esac
          		if is_usb_dev "$_d"; then
          			_kind="usb"
          			[ -n "$_label" ] || _label="USB"
          		fi
          		_wan_json=false
          		if is_wan_dev "$_d"; then
          			_wan_json=true
          			case "$_kind" in
          				other) _kind="wan" ;;
          			esac
          		fi

          		_tr=0; _tt=0
          		_st="$(get_dev "$_d")"
          		if [ -n "$_st" ]; then
          			set -- $_st
          			_tr="$1"
          			_tt="$2"
          			is_uint "$_tr" || _tr=0
          			is_uint "$_tt" || _tt=0
          		fi

          		_rr=0; _rt=0
          		_rs="$(get_rate "$_d")"
          		if [ -n "$_rs" ]; then
          			set -- $_rs
          			_rr="$1"
          			_rt="$2"
          			is_num "$_rr" || _rr=0
          			is_num "$_rt" || _rt=0
          		fi

          		_ih="$(json_history "$IFHIST_DIR/$_d")"
          		[ -n "$_ih" ] || _ih="[]"

          		[ -n "$_iface_cards" ] && _iface_cards="$_iface_cards,"
          		_iface_cards="$_iface_cards{\"device\":\"$_d\",\"label\":\"$_label\",\"kind\":\"$_kind\",\"wan\":$_wan_json,\"up\":$_up_json,\"speed\":$_speed,\"duplex\":\"$_duplex\",\"rx_rate\":$_rr,\"tx_rate\":$_rt,\"rx_total\":$_tr,\"tx_total\":$_tt,\"history\":$_ih}"
          	done

          	_hist="$(awk 'BEGIN { printf "[" } { printf "%s[%s,%s]", (NR > 1 ? "," : ""), $1, $2 } END { printf "]" }' "$HISTFILE" 2>/dev/null)"
          	[ -n "$_hist" ] || _hist="[]"

          	_tmp="$STATUS_FILE.$$.tmp"
          	{
          		printf '{\n'
          		printf '  "ok": true,\n'
          		printf '  "version": 1,\n'
          		printf '  "time": %s,\n' "$_now"
          		printf '  "uptime": %s,\n' "${_uptime:-0}"
          		printf '  "wan_detected": %s,\n' "$_wan_ok"
          		printf '  "interfaces": [%s],\n' "$_wan_list"
          		printf '  "usb_found": %s,\n' "$_usb_found"
          		printf '  "ifaces": [%s],\n' "$_iface_cards"
          		printf '  "uplinks": [%s],\n' "$_uplinks"
          		printf '  "rx_rate": %s,\n' "$_rx_rate"
          		printf '  "tx_rate": %s,\n' "$_tx_rate"
          		printf '  "rx_total": %s,\n' "$TOTAL_RX"
          		printf '  "tx_total": %s,\n' "$TOTAL_TX"
          		printf '  "day": "%s",\n' "$DAY"
          		printf '  "day_rx": %s,\n' "$DAY_RX"
          		printf '  "day_tx": %s,\n' "$DAY_TX"
          		printf '  "month": "%s",\n' "$MONTH"
          		printf '  "month_rx": %s,\n' "$MONTH_RX"
          		printf '  "month_tx": %s,\n' "$MONTH_TX"
          		printf '  "interval": %s,\n' "$INTERVAL"
          		printf '  "save_interval": %s,\n' "$SAVE_INTERVAL"
          		printf '  "saved_at": %s,\n' "${SAVED_AT:-0}"
          		printf '  "ports": [%s],\n' "$_ports"
          		printf '  "system": '
          		if [ -s "$SYSINFO_FILE" ]; then
          			cat "$SYSINFO_FILE"
          		else
          			printf 'null\n'
          		fi
          		printf ',\n'
          		printf '  "history": %s\n' "$_hist"
          		printf '}\n'
          	} > "$_tmp" || {
          		rm -f "$_tmp"
          		return 1
          	}
          	mv -f "$_tmp" "$STATUS_FILE"
          }

          reset_counters() {
          	: > "$DEVFILE"
          	for _d in $MON_DEVS; do
          		read_bytes "$_d"
          		put_dev "$_d" 0 0 "$R_RX" "$R_TX"
          	done
          	TOTAL_RX=0
          	TOTAL_TX=0
          	DAY_RX=0
          	DAY_TX=0
          	MONTH_RX=0
          	MONTH_TX=0
          	: > "$HISTFILE"
          	rm -rf "$IFHIST_DIR" "$IFHIST_STATE_DIR" 2>/dev/null || true
          	mkdir -p "$IFHIST_DIR" "$IFHIST_STATE_DIR" 2>/dev/null || true
          	save_state
          	log "counters reset"
          }

          load_config

          mkdir -p "$STATE_DIR" "$RUN_DIR" || exit 1
          echo $$ > "$PIDFILE"
          : > "$DEVFILE"
          : > "$HISTFILE"
          : > "$RATES_FILE"
          mkdir -p "$IFHIST_DIR" "$IFHIST_STATE_DIR" 2>/dev/null || true

          TOTAL_RX=0
          TOTAL_TX=0
          DAY=""
          MONTH=""
          DAY_RX=0
          DAY_TX=0
          MONTH_RX=0
          MONTH_TX=0
          SAVED_AT=0

          load_state
          sum_devices
          check_periods

          WAN_DEVS=""
          MON_DEVS=""
          USB_DEVS=""
          LAST_TIME=""
          LAST_DETECT=0
          LAST_DATE_CHECK=0
          LAST_SAVE_INT=0
          LAST_SYSINFO=0
          RESET_REQUESTED=0
          STOP_REQUESTED=0

          trap 'STOP_REQUESTED=1' TERM INT
          trap 'RESET_REQUESTED=1' USR1

          detect_wan
          detect_monitors
          restore_history
          collect_system
          collect_wan_info

          log "started (interval=${INTERVAL}s, save=${SAVE_INTERVAL}s)"

          while [ "$STOP_REQUESTED" = 0 ]; do
          	read_uptime
          	_uptime="$UPTIME"
          	_uptime_int="${_uptime%%.*}"
          	is_uint "$_uptime_int" || _uptime_int=0

          	if [ -z "$WAN_DEVS" ] || [ $((_uptime_int - LAST_DETECT)) -ge 15 ]; then
          		detect_wan
          		detect_monitors
          		collect_wan_info
          		LAST_DETECT="$_uptime_int"
          	fi

          	if [ "$RESET_REQUESTED" = 1 ]; then
          		reset_counters
          		RESET_REQUESTED=0
          		LAST_TIME=""
          	fi

          	if [ $((_uptime_int - LAST_DATE_CHECK)) -ge 30 ]; then
          		check_periods
          		LAST_DATE_CHECK="$_uptime_int"
          	fi

          	_elapsed=0
          	if [ -n "$LAST_TIME" ]; then
          		_elapsed="$(awk -v a="$_uptime" -v b="$LAST_TIME" 'BEGIN { d = a - b; if (d < 0) d = 0; printf "%.3f", d }')"
          	fi

          	SAMPLE_RX=0
          	SAMPLE_TX=0
          	_rates_tmp="$RATES_FILE.$$.tmp"
          	: > "$_rates_tmp"

          	for _mon in $MON_DEVS; do
          		read_bytes "$_mon"

          		_state="$(get_dev "$_mon")"
          		if [ -n "$_state" ]; then
          			set -- $_state
          			_tr="$1"
          			_tt="$2"
          			_lr="$3"
          			_lt="$4"
          			is_uint "$_tr" || _tr=0
          			is_uint "$_tt" || _tt=0
          			is_uint "$_lr" || _lr=0
          			is_uint "$_lt" || _lt=0

          			if [ "$R_RX" -ge "$_lr" ]; then
          				_dr=$((R_RX - _lr))
          			else
          				_dr=$R_RX
          			fi
          			if [ "$R_TX" -ge "$_lt" ]; then
          				_dt=$((R_TX - _lt))
          			else
          				_dt=$R_TX
          			fi
          		else
          			_tr=0
          			_tt=0
          			_dr=0
          			_dt=0
          		fi

          		_tr=$((_tr + _dr))
          		_tt=$((_tt + _dt))
          		put_dev "$_mon" "$_tr" "$_tt" "$R_RX" "$R_TX"

          		if [ "$_elapsed" = "0" ] || [ "$_elapsed" = "0.000" ]; then
          			_prx=0
          			_ptx=0
          		else
          			_prx="$(awk -v d="$_dr" -v t="$_elapsed" 'BEGIN { if (t > 0) printf "%.2f", d / t; else print "0.00" }')"
          			_ptx="$(awk -v d="$_dt" -v t="$_elapsed" 'BEGIN { if (t > 0) printf "%.2f", d / t; else print "0.00" }')"
          		fi
          		printf '%s|%s|%s\n' "$_mon" "$_prx" "$_ptx" >> "$_rates_tmp"
          		append_hist "$IFHIST_DIR/$_mon" "$_prx" "$_ptx"

          		if is_wan_dev "$_mon"; then
          			SAMPLE_RX=$((SAMPLE_RX + _dr))
          			SAMPLE_TX=$((SAMPLE_TX + _dt))
          		fi
          	done
          	mv -f "$_rates_tmp" "$RATES_FILE"

          	sum_devices

          	if [ "$_elapsed" = "0" ] || [ "$_elapsed" = "0.000" ]; then
          		_rx_rate="0.00"
          		_tx_rate="0.00"
          	else
          		_rx_rate="$(awk -v d="$SAMPLE_RX" -v t="$_elapsed" 'BEGIN { if (t > 0) printf "%.2f", d / t; else print "0.00" }')"
          		_tx_rate="$(awk -v d="$SAMPLE_TX" -v t="$_elapsed" 'BEGIN { if (t > 0) printf "%.2f", d / t; else print "0.00" }')"
          	fi

          	DAY_RX=$((DAY_RX + SAMPLE_RX))
          	DAY_TX=$((DAY_TX + SAMPLE_TX))
          	MONTH_RX=$((MONTH_RX + SAMPLE_RX))
          	MONTH_TX=$((MONTH_TX + SAMPLE_TX))

          	LAST_TIME="$_uptime"

          	printf '%s %s\n' "$_rx_rate" "$_tx_rate" >> "$HISTFILE"
          	tail -n "$HISTORY_LEN" "$HISTFILE" > "$HISTFILE.tmp" 2>/dev/null && mv -f "$HISTFILE.tmp" "$HISTFILE"

          	if [ $((_uptime_int - LAST_SYSINFO)) -ge "$SYSINFO_INTERVAL" ]; then
          		collect_system
          		LAST_SYSINFO="$_uptime_int"
          	fi

          	collect_ports
          	write_status "$_rx_rate" "$_tx_rate"

          	if [ $((_uptime_int - LAST_SAVE_INT)) -ge "$SAVE_INTERVAL" ]; then
          		save_state
          		LAST_SAVE_INT="$_uptime_int"
          	fi

          	_sleep_left="$INTERVAL"
          	while [ "$_sleep_left" -gt 0 ] && [ "$STOP_REQUESTED" = 0 ]; do
          		sleep 1
          		_sleep_left=$((_sleep_left - 1))
          	done
          done

          save_state
          rm -f "$PIDFILE"
          log "stopped"
          exit 0
